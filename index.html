<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>化学方程式实验室</title>
<style>
:root{
  --bg:#EDEFF5;
  --panel:#FFFFFF;
  --panel-2:#F5F6FB;
  --ink:#12141A;
  --ink-2:#5B6273;
  --line:#E1E4EE;
  --brand:#4B3FE3;
  --brand-2:#6F6FFF;
  --brand-soft:#EDEBFF;
  --brand-ink:#1A1759;
  --ok:#0F9D58;
  --bond:#8A90A0;
  --ionic:#A8ADBB;
  --val:#7C3AED;
  --bondc:#0E7490;
  --danger:#A5261B;
  --radius:14px;
  --shadow:0 10px 30px rgba(18,20,26,.08);
  --topbg:rgba(255,255,255,.88);
  --meta-liquid:#EDF1F5;
}
html[data-theme="dark"]{
  --bg:#0F1218;
  --panel:#171C26;
  --panel-2:#1F2531;
  --ink:#E9ECF4;
  --ink-2:#A3ABBD;
  --line:#2B3242;
  --brand:#8F88FF;
  --brand-2:#A9A4FF;
  --brand-soft:#262B52;
  --brand-ink:#DEDBFF;
  --ok:#4ADE80;
  --bond:#7B8296;
  --ionic:#69718A;
  --val:#C4B5FD;
  --bondc:#67E8F9;
  --danger:#FF8A80;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --topbg:rgba(15,18,24,.88);
  --meta-liquid:#1E2C3D;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.top{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
  gap:10px 16px;
  padding:10px 24px;
  background:var(--topbg);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.coursetabs{
  flex:0 0 100%;
  max-width:1132px;
  margin:0 auto;
  display:flex;
  gap:6px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  padding:4px;
}
.coursetab{
  flex:1;
  text-align:center;
  padding:7px 12px;
  border-radius:10px;
  font-size:14px;
  font-weight:500;
  line-height:1.4;
  color:var(--ink-2);
  text-decoration:none;
  transition:background .15s,color .15s;
}
.coursetab:hover{background:var(--panel-2);color:var(--ink);}
.coursetab.on{background:var(--brand-soft);color:var(--brand-ink);font-weight:600;}
.brand{display:flex;align-items:center;gap:12px;}
.logo{
  width:40px;height:40px;border-radius:12px;
  background:var(--brand);color:#fff;
  display:flex;align-items:center;justify-content:center;
  flex:0 0 40px;
}
h1{font-size:19px;margin:0;font-weight:600;letter-spacing:.2px;}
.tagline{font-size:12px;color:var(--ink-2);margin:2px 0 0;}
.tagline .ver{margin-left:8px;padding-left:8px;border-left:1px solid var(--line);color:var(--brand);font-variant-numeric:tabular-nums;}
.switch{
  display:flex;align-items:center;gap:8px;
  font-size:13px;color:var(--ink-2);cursor:pointer;user-select:none;
}
.switch input{
  appearance:none;-webkit-appearance:none;
  width:40px;height:22px;border-radius:999px;background:#D7DAE4;
  position:relative;cursor:pointer;transition:background .18s;outline:none;border:none;margin:0;
}
.switch input:checked{background:var(--brand);}
.switch input::after{
  content:"";position:absolute;top:3px;left:3px;
  width:16px;height:16px;border-radius:50%;background:#fff;
  transition:transform .18s;
}
.switch input:checked::after{transform:translateX(18px);}
main{padding:14px 24px 48px;max-width:1180px;margin:0 auto;}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
.filters button{
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--ink-2);
  padding:7px 15px;
  border-radius:999px;
  font-size:13px;
  font-family:inherit;
  cursor:pointer;
  transition:background .15s,border-color .15s,color .15s;
}
.filters button:hover{border-color:var(--brand);color:var(--brand);}
.filters button.on{background:var(--brand);border-color:var(--brand);color:#fff;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(305px,1fr));gap:16px;}
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px 18px 14px;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  transition:transform .16s,box-shadow .16s,border-color .16s;
}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--brand);}
.card-top{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);}
.tag{background:var(--panel-2);border-radius:999px;padding:2px 9px;}
.stars{color:#F0A11A;letter-spacing:1px;margin-left:auto;}
.card h3{margin:10px 0 8px;font-size:17px;font-weight:600;}
.eqline{
  font-size:16px;
  font-weight:500;
  color:var(--brand-ink);
  background:var(--brand-soft);
  border-radius:10px;
  padding:10px 12px;
  letter-spacing:.3px;
  word-break:break-word;
}
.card-foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:12px;gap:10px;}
.book{font-size:12px;color:var(--ink-2);}
.iconbox{
  width:84px;height:68px;
  display:flex;align-items:center;justify-content:center;
  background:var(--panel-2);
  border-radius:12px;
  line-height:0;
  overflow:hidden;
}
.detail-head{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;}
.detail-head.spread{justify-content:space-between;}
.detail-head h2{margin:0;font-size:23px;line-height:1.2;}
.detail-head .meta{margin:0;font-size:13px;gap:8px;flex-wrap:wrap;}
.detail-head .head-btns{margin-left:auto;}
@media (min-width:821px){
  .detail-head.sticky-head{
    position:sticky;top:var(--topH,96px);z-index:19;
    background:var(--bg);padding:3px 0;margin:-3px 0 4px;
  }
}
@media (min-width:1000px){
  .top{flex-wrap:nowrap;padding:8px 20px;gap:0 14px;}
  .coursetabs{flex:1 1 auto;max-width:none;margin:0;width:auto;padding:4px;}
  .brand{flex:0 0 auto;}
  .top-right{flex:0 0 auto;}
}
.back{
  border:none;background:transparent;color:var(--brand);
  font-size:14px;font-family:inherit;cursor:pointer;padding:4px 0;
}
h2{font-size:25px;margin:12px 0 4px;font-weight:600;}
.meta{font-size:13px;color:var(--ink-2);margin-bottom:18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.stage{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px 18px;
  display:flex;
  align-items:stretch;
  gap:10px;
}
.pane{flex:1 1 0;min-width:0;display:flex;flex-direction:column;}
.pane-title{font-size:12px;color:var(--ink-2);letter-spacing:.6px;margin-bottom:6px;}
.species-wrap{
  display:flex;flex-wrap:wrap;gap:16px;
  align-items:center;justify-content:center;flex:1;
}
.sp{display:flex;flex-direction:column;align-items:center;gap:8px;margin:0;}
.sp-art{display:flex;align-items:center;justify-content:center;min-height:96px;}
.sp-art svg{max-width:100%;height:auto;}
.sp figcaption{font-size:13px;display:flex;align-items:baseline;gap:5px;flex-wrap:wrap;justify-content:center;text-align:center;}
.sp .coef{color:var(--brand);font-weight:700;font-size:16px;}
.sp .fml{font-weight:600;}
.sp .nm{color:var(--ink-2);font-size:12px;}
.valrow{
  display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;
  font-size:12px;color:var(--ink-2);
}
.valrow .vitem b{color:var(--val);font-weight:700;}
.valrow .vtag{
  background:#F1EBFF;color:var(--val);border-radius:6px;
  padding:1px 6px;font-weight:600;font-size:11px;
}
.bondrow{
  display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;
  font-size:12px;color:var(--ink-2);
}
.bondrow .btag{
  background:#E4F5F8;color:var(--bondc);border-radius:6px;
  padding:1px 6px;font-weight:600;font-size:11px;
}
.bondrow .bitem{padding:1px 0;}
.top-right{display:flex;align-items:center;gap:14px;}
.arrow-col{
  width:112px;flex:0 0 112px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
}
.cond{
  font-size:12px;color:var(--ink-2);
  background:var(--panel-2);border-radius:999px;padding:2px 11px;
  white-space:nowrap;
}
.arrow-svg{color:var(--brand);display:block;}
.ledger{
  margin-top:18px;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:12px 16px;
}
.ledger-title{font-size:13px;color:var(--ink-2);margin-bottom:8px;}
.lrows{display:flex;flex-wrap:wrap;gap:8px;}
.lrow{
  display:flex;align-items:center;gap:7px;
  background:var(--panel-2);border:1px solid transparent;border-radius:10px;
  padding:7px 12px;font-size:14px;
}
.lrow .lel{font-weight:600;}
.lrow .num{font-variant-numeric:tabular-nums;}
.lrow .tick{color:var(--ok);font-weight:700;}
/* 配平工作台 */
.hintline{font-size:13px;color:var(--ink-2);margin:0 0 12px;}
.btn{
  border:1px solid var(--line);background:var(--panel);color:var(--ink);
  font-family:inherit;font-size:14px;line-height:1.2;
  padding:8px 14px;border-radius:10px;cursor:pointer;
  transition:border-color .15s,color .15s,background .15s;
}
.btn:hover{border-color:var(--brand);color:var(--brand);}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;}
.btn.primary:hover{background:#3B30CF;color:#fff;}
.coefbox{
  display:flex;align-items:center;gap:4px;
  background:var(--panel-2);border-radius:999px;padding:3px 4px;
}
.cbtn{
  width:26px;height:26px;border-radius:50%;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);padding:0;
  font-family:inherit;font-size:15px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:border-color .15s,color .15s;
}
.cbtn:hover:not(:disabled){border-color:var(--brand);color:var(--brand);}
.cbtn:disabled{opacity:.3;cursor:default;}
.cval{
  min-width:16px;text-align:center;
  color:var(--brand);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;
}
.lrow.ok{background:#F0FAF4;border-color:#CBE9D6;}
.lrow.bad{background:#FFF3F1;border-color:#F2C7C0;}
.lrow.bad .num{color:var(--danger);}
.lrow.bad .tick{color:#C8372A;}
.bfb{
  margin-top:16px;border-radius:12px;padding:11px 14px;
  font-size:14px;border:1px solid;
}
.bfb.good{background:#EAF7EF;border-color:#BFE3CC;color:var(--ok);}
.bfb.bad{background:#FFF3F1;border-color:#F2C7C0;color:var(--danger);}
.bfb.warn{background:#FFF8E6;border-color:#F0E0AE;color:#7A5A06;}
.bbtns{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;}
.head-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.head-btns .switch{font-size:12px;gap:6px;}
.head-btns .switch span{display:inline;}
.head-btns .switch input{width:34px;height:18px;}
.head-btns .switch input::after{width:14px;height:14px;top:2px;left:2px;}
.head-btns .switch input:checked::after{transform:translateX(16px);}
#view.hide-val .anim-info-line .v{display:none;}
#view.hide-val .valrow{display:none;}
/* 拆解动画 */
.anim-wrap{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 18px 18px;}
.anim-svg{display:block;width:100%;max-width:1000px;height:auto;margin:0 auto;user-select:none;}
.anim-svg text{font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;}
.phases{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
.phasechip{
  font-size:12px;color:var(--brand);background:var(--brand-soft);
  border:1px solid #D5D1FF;border-radius:999px;padding:4px 11px;
  font-family:inherit;line-height:1.4;cursor:pointer;
  transition:background .15s,color .15s,border-color .15s;
}
.phasechip:hover{border-color:var(--brand);color:var(--brand-ink);}
.phasechip.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600;}
.phasechip.on.warn{background:#FFF3F1;color:var(--danger);border-color:#F2C7C0;}
.bondlegend{
  display:flex;flex-wrap:wrap;gap:14px;
  margin-top:10px;font-size:12px;color:var(--ink-2);
}
.bondlegend span{display:inline-flex;align-items:center;gap:6px;}
.bondlegend i{display:inline-block;width:24px;height:0;border-top:2px solid var(--bond);}
.bondlegend i.double{height:6px;border-bottom:2px solid var(--bond);}
.bondlegend i.triple{
  height:10px;border-top:none;
  background:repeating-linear-gradient(to bottom,var(--bond) 0 2px,transparent 2px 4px);
}
.bondlegend i.ionic{width:24px;border-top:2px dashed var(--ionic);}
.anim-controlbar{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;
  margin:0 0 8px;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:8px 14px;
}
.anim-controlbar .bondlegend{margin-top:0;gap:8px;font-size:11.5px;}
.anim-controlbar .bondlegend i{width:20px;}
.anim-controlbar .phases{margin-top:0;}
.anim-controlbar .btn{padding:6px 12px;font-size:13px;}
.anim-controlbar [data-full-anim]{min-width:104px;text-align:center;}
.phases-hint{font-size:12px;color:var(--ink-2);white-space:nowrap;}
.phase-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:8px;}
.anim-tail{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
@media (min-width:821px){
  .anim-tail{margin-left:auto;}
}
@media (min-width:821px) and (max-width:1120px){
  .anim-controlbar{gap:8px 10px;}
  .anim-controlbar .phase-group{margin-left:6px;}
  .anim-controlbar .phasechip{padding:4px 9px;}
  .anim-controlbar .phases{gap:6px;}
}
@media (max-width:820px){
  .phase-group{flex-direction:column;align-items:flex-start;gap:6px;flex-basis:100%;margin-left:0;}
  .phase-group .phases{width:100%;}
}
.detail-anim-wrap{padding:8px 12px 12px;}
.anim-canvas-wrap{position:relative;}
.anim-info{
  position:absolute;left:0;right:0;bottom:0;
  display:grid;grid-template-columns:1fr 1fr;gap:2px 22px;
  padding:8px 18px 2px;font-size:10.5px;line-height:1.5;
  background:linear-gradient(180deg,rgba(255,255,255,0) 0%,var(--panel) 45%);
  pointer-events:none;
}
html[data-theme="dark"] .anim-info{background:linear-gradient(180deg,rgba(23,28,38,0) 0%,var(--panel) 45%);}
.anim-info-col{display:flex;flex-direction:column;gap:1px;}
.anim-info-line{display:flex;flex-wrap:wrap;gap:2px 6px;align-items:baseline;color:var(--ink-2);}
.anim-info-line b{color:var(--ink);font-weight:600;}
.anim-info-line .v{color:var(--val);font-weight:700;font-size:11px;display:inline-flex;align-items:center;gap:3px;}
.anim-info-line .vtag{font-style:normal;font-weight:700;font-size:9px;line-height:1.5;padding:0 4px;border-radius:4px;background:var(--val);color:#fff;}
html[data-theme="dark"] .anim-info-line .vtag{color:#1B1533;}
.anim-info-line .b{color:var(--bondc);}
.anim-info-note{
  grid-column:1/-1;justify-self:start;
  display:inline-flex;align-items:center;gap:5px;
  font-size:11px;line-height:1.4;padding:3px 10px;border-radius:999px;
  background:var(--brand-soft);color:var(--brand-ink);
}
.anim-info-note b{color:var(--val);font-weight:700;}
#view.hide-val .anim-info-note{display:none;}
@media (max-width:820px){
  .anim-info{position:static;background:none;padding:6px 2px 0;grid-template-columns:1fr;gap:5px;}
}
.caption{
  margin-top:12px;font-size:15px;line-height:1.55;min-height:48px;
  background:var(--panel-2);border-radius:12px;padding:10px 14px;
}
.anim-counts{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:13px;color:var(--ink-2);}
.acount{background:var(--panel-2);border-radius:10px;padding:6px 12px;font-variant-numeric:tabular-nums;}
.acount b{font-weight:600;color:var(--ink);}
.acount.bad{background:#FFF3F1;color:var(--danger);}
.acount.bad b{color:var(--danger);}
.animbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;}
.animbar .note{font-size:12px;color:var(--ink-2);}
/* 化学键图鉴 */
.bondcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;}
.bondcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;}
.bondcard h3{margin:0 0 6px;font-size:17px;}
.bondcard p{margin:0 0 10px;font-size:13px;color:var(--ink-2);}
.bondcard .bsmall{font-size:12px;margin:8px 0 0;}
.bondsample{
  min-height:96px;background:var(--panel-2);border-radius:12px;
  display:flex;align-items:center;justify-content:center;padding:6px;
}
.section-h{font-size:17px;margin:26px 0 4px;}
.section-sub{font-size:13px;color:var(--ink-2);margin:0 0 14px;}
.bondmolrow{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px;}
.bondmol{
  background:var(--panel-2);border-radius:12px;padding:6px 14px 4px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:12px;color:var(--ink-2);line-height:1.3;
}
.bondmol b{color:var(--ink);font-weight:600;font-size:13px;}
.bondbars{
  display:flex;flex-direction:column;gap:9px;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;
}
.bbrow{display:grid;grid-template-columns:96px 1fr 64px;align-items:center;gap:10px;font-size:13px;}
.bbtrack{height:14px;background:var(--panel-2);border-radius:999px;overflow:hidden;}
.bbfill{height:100%;border-radius:999px;background:var(--brand);}
.bbrow.n .bbfill{background:#0E7490;}
.bbrow.f .bbfill{background:#B45309;}
.bbval{text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums;}
.callout{
  margin-top:14px;background:#FFF8E6;border:1px solid #F0E0AE;
  color:#6B4E00;border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.6;
}
.callout.good{background:#EAF7EF;border-color:#BFE3CC;color:var(--ok);}
.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:14px;}
.compare > div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;}
.compare h4{margin:0 0 6px;font-size:14px;}
.compare p{margin:0;font-size:13px;color:var(--ink-2);}
/* 化学键课堂 */
.lesson{display:grid;grid-template-columns:228px minmax(0,1fr);gap:20px;align-items:start;}
.lesson-nav{
  position:sticky;top:143px;background:var(--panel);border:1px solid var(--line);
  border-radius:16px;padding:10px 8px;display:flex;flex-direction:column;gap:3px;
}
.nav-group{font-size:11px;color:var(--ink-2);letter-spacing:.5px;padding:9px 10px 4px;}
.nav-item{
  border:none;background:transparent;text-align:left;font-family:inherit;
  font-size:14px;color:var(--ink);padding:8px 10px;border-radius:9px;
  cursor:pointer;line-height:1.35;
}
.nav-item:hover{background:var(--panel-2);}
.nav-item.on{background:var(--brand-soft);color:var(--brand-ink);font-weight:600;}
.g9-switch{
  display:inline-flex;gap:3px;margin-left:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;
}
.g9-switch button{
  border:none;background:transparent;color:var(--ink-2);font-family:inherit;
  font-size:13px;line-height:1.2;padding:5px 14px;border-radius:8px;cursor:pointer;
}
.g9-switch button.on{background:var(--brand-soft);color:var(--brand-ink);font-weight:600;}
.g9-links{display:flex;flex-wrap:wrap;gap:8px;}
.g9-links a{
  display:inline-block;text-decoration:none;
  border:1px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:9px;padding:6px 11px;font-size:13px;line-height:1.3;
}

/* ============================================================
   ④ 渲染：把一个物质画成 SVG 球棍模型
   ============================================================ */
function svgFor(key, opts) {
  opts = opts || {};
  const sp = SPECIES[key];
  const S = opts.scale || 30;
  const k0 = S / 30;
  const rs = sp.rs || 1;
  const PAD = Math.round((opts.tight ? 10 : 15) * k0);

  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  const geo = sp.atoms.map(function (a) {
    const r = EL[a.el].r * k0 * rs;
    const x = a.x * S;
    const y = a.y * S;
    minX = Math.min(minX, x - r);
    maxX = Math.max(maxX, x + r);
    minY = Math.min(minY, y - r);
    maxY = Math.max(maxY, y + r);
    return { x: x, y: y, r: r, el: a.el };
  });

  const rawW = (maxX - minX) + PAD * 2;
  const rawH = (maxY - minY) + PAD * 2;
  const maxFit = opts.grow ? (typeof opts.grow === 'number' ? opts.grow : 2.4) : 1;
  const fit = Math.min(maxFit, (opts.fitW || 300) / rawW, (opts.fitH || 210) / rawH);
  const tx = PAD - minX;
  const ty = PAD - minY;

  let bondMarkup = '';
  sp.bonds.forEach(function (b) {
    const A = geo[b[0]];
    const B = geo[b[1]];
    const order = b[2];

    if (order === -1) {
      bondMarkup += '<line x1="' + A.x + '" y1="' + A.y + '" x2="' + B.x + '" y2="' + B.y + '"'
        + ' stroke="var(--ionic)" stroke-width="' + (1.5 * k0) + '" stroke-dasharray="' + (4 * k0) + ' ' + (5 * k0) + '"/>';
      return;
    }

    const dx = B.x - A.x;
    const dy = B.y - A.y;
    const len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len;
    const ny = dx / len;
    const offs = order === 1 ? [0] : (order === 2 ? [-4.4, 4.4] : [-7, 0, 7]);
    const w = Math.max(1.3, 2.2 * k0);

    offs.forEach(function (o) {
      const oo = o * k0;
      bondMarkup += '<line x1="' + (A.x + nx * oo) + '" y1="' + (A.y + ny * oo) + '"'
        + ' x2="' + (B.x + nx * oo) + '" y2="' + (B.y + ny * oo) + '"'
        + ' stroke="var(--bond)" stroke-width="' + w + '" stroke-linecap="round"/>';
    });
  });

  let atomMarkup = '';
  sp.atoms.forEach(function (a, i) {
    const g = geo[i];
    const e = EL[a.el];
    const fs = Math.min(15, Math.max(11, g.r * 0.92));

    atomMarkup += '<circle cx="' + g.x + '" cy="' + g.y + '" r="' + g.r + '"'
      + ' fill="' + e.fill + '" stroke="' + e.stroke + '" stroke-width="' + (1.2 * k0) + '"/>';
    atomMarkup += '<text x="' + g.x + '" y="' + g.y + '" text-anchor="middle" dominant-baseline="central"'
      + ' font-size="' + fs + '" font-weight="600" fill="' + e.ink + '">' + a.el + '</text>';
  });

  return '<svg viewBox="0 0 ' + rawW + ' ' + rawH + '"'
    + ' width="' + Math.round(rawW * fit) + '" height="' + Math.round(rawH * fit) + '"'
    + ' role="img" aria-label="' + sp.name + '的球棍模型">'
    + '<g transform="translate(' + tx + ',' + ty + ')">' + bondMarkup + atomMarkup + '</g>'
    + '</svg>';
}

/* ============================================================
   ⑤ 文字拼接
   ============================================================ */
function sideText(items) {
  return items.map(function (it) {
    const c = it.coef > 1 ? it.coef : '';
    return c + SPECIES[it.sp].formula + (it.mark || '');
  }).join(' + ');
}

function eqText(r) {
  return sideText(r.left) + ' → ' + sideText(r.right);
}

function starsFor(level) {
  return '★'.repeat(level) + '☆'.repeat(3 - level);
}

function countAtoms(items) {
  const map = {};
  items.forEach(function (it) {
    const sp = SPECIES[it.sp];
    sp.atoms.forEach(function (a) {
      map[a.el] = (map[a.el] || 0) + it.coef;
    });
  });
  return map;
}

/* ---------- 导出反应学习卡 ---------- */
const EXPORT_THEMES = {
  light: {
    bg: '#FFFFFF', ink: '#12141A', ink2: '#5B6273', line: '#E1E4EE',
    brand: '#4B3FE3', brandSoft: '#EDEBFF', brandInk: '#1A1759',
    val: '#7C3AED', bondc: '#0E7490', bond: '#8A90A0', ionic: '#A8ADBB',
    ok: '#0F9D58', danger: '#A5261B', panel: '#FFFFFF', panel2: '#F5F6FB'
  },
  dark: {
    bg: '#0F1218', ink: '#E9ECF4', ink2: '#A3ABBD', line: '#2B3242',
    brand: '#8F88FF', brandSoft: '#262B52', brandInk: '#DEDBFF',
    val: '#C4B5FD', bondc: '#67E8F9', bond: '#7B8296', ionic: '#69718A',
    ok: '#4ADE80', danger: '#FF8A80', panel: '#171C26', panel2: '#1F2531'
  }
};

function escSvgText(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function wrapByLen(text, max) {
  const lines = [];
  let line = '';
  for (let i = 0; i < text.length; i++) {
    line += text.charAt(i);
    if (line.length >= max) { lines.push(line); line = ''; }
  }
  if (line) lines.push(line);
  return lines;
}

function exportVarMap(T) {
  return {
    '--brand': T.brand, '--brand-2': T.brand, '--brand-soft': T.brandSoft, '--brand-ink': T.brandInk,
    '--ink': T.ink, '--ink-2': T.ink2, '--line': T.line, '--panel': T.panel, '--panel-2': T.panel2,
    '--bond': T.bond, '--ionic': T.ionic, '--val': T.val, '--bondc': T.bondc,
    '--ok': T.ok, '--danger': T.danger
  };
}

/* 一种物质两行：化学式+名称；键型与化合价（过长自动换行） */
function exportSpeciesSvg(item, x, y, maxChars, T) {
  const sp = SPECIES[item.sp];
  const coef = item.coef > 1 ? item.coef + ' ' : '';
  const val = Object.keys(sp.valence || {}).map(function (el) {
    const v = sp.valence[el];
    return el + (v > 0 ? ' +' + v : ' ' + v);
  }).join(' · ');
  const bond = sp.bondNote || bondTexts(sp).join('；');

  let out = '<text x="' + x + '" y="' + y + '" font-size="15" fill="' + T.ink + '">'
    + '<tspan font-weight="700">' + escSvgText(coef + sp.formula + (item.mark || '')) + '</tspan>'
    + '<tspan font-size="13" fill="' + T.ink2 + '">　' + escSvgText(sp.name) + '</tspan></text>';

  let cy = y + 18;
  const bondLines = bond ? wrapByLen('键 ' + bond, maxChars) : [];
  bondLines.forEach(function (line) {
    out += '<text x="' + x + '" y="' + cy + '" font-size="12.5" fill="' + T.bondc + '">'
      + escSvgText(line) + '</text>';
    cy += 17;
  });
  const valLines = val ? wrapByLen('价 ' + val, maxChars) : [];
  valLines.forEach(function (line) {
    out += '<text x="' + x + '" y="' + cy + '" font-size="12.5" fill="' + T.val + '">'
      + escSvgText(line) + '</text>';
    cy += 17;
  });

  return { svg: out, h: cy - y + 8 };
}

function buildExportSvg(r) {
  const T = EXPORT_THEMES[currentTheme() === 'dark' ? 'dark' : 'light'];
  const sc = animScene(r, 'ok', false, { noEq: true, noLabels: true });
  let stage = animSvg(sc);
  // 反应前状态：只显示左侧分子内部的键，右侧只留生成物原子
  stage = stage.replace(/<line data-b="(\d+)"([^>]*?)opacity="0"/g, function (m, idx, rest) {
    const b = sc.bonds[Number(idx)];
    return b && b.a < sc.atoms.length && b.b < sc.atoms.length
      ? '<line data-b="' + idx + '"' + rest + 'opacity="1"'
      : m;
  });
  stage = stage.replace(/^<svg[^>]*>/, '').replace(/<\/svg>\s*$/, '');

  const W = 1000;
  const SH = sc.H;
  const eq = sideText(r.left) + ' —' + r.cond + '→ ' + sideText(r.right);
  const L = countAtoms(r.left);
  const R = countAtoms(r.right);
  const els = (sc.elements && sc.elements.length) ? sc.elements : Object.keys(L);
  const tallyLine = function (M) {
    return els.map(function (el) { return el + ' ' + (M[el] || 0); }).join(' · ');
  };

  const stageTop = 220;
  const stageEnd = stageTop + SH;
  const infoTitleY = stageEnd + 34;
  const infoBodyY = infoTitleY + 24;

  let infoMk = '<text x="50" y="' + infoTitleY + '" font-size="13" fill="' + T.ink2 + '">反应物</text>'
    + '<text x="510" y="' + infoTitleY + '" font-size="13" fill="' + T.ink2 + '">生成物</text>';
  let yL = infoBodyY;
  r.left.forEach(function (it) {
    const b = exportSpeciesSvg(it, 50, yL, 34, T);
    infoMk += b.svg;
    yL += b.h;
  });
  let yR = infoBodyY;
  r.right.forEach(function (it) {
    const b = exportSpeciesSvg(it, 510, yR, 34, T);
    infoMk += b.svg;
    yR += b.h;
  });
  const infoH = Math.max(yL, yR) - infoBodyY;

  const countsY = infoBodyY + infoH + 30;
  const ledgerTitleY = countsY + 34;
  const ledgerY = ledgerTitleY + 24;

  let ledMk = '<text x="50" y="' + ledgerTitleY + '" font-size="13" fill="' + T.ink2 + '">原子账本 · 每种原子的个数必须相等</text>';
  let ledX = 50;
  els.forEach(function (el) {
    const a = L[el] || 0;
    const b = R[el] || 0;
    const ok = a === b;
    const txt = el + ' ' + a + ' = ' + b + (ok ? ' ✓' : ' ✗ 差 ' + Math.abs(a - b));
    ledMk += '<text x="' + ledX + '" y="' + ledgerY + '" font-size="13.5" font-weight="600" fill="' + (ok ? T.ok : T.danger) + '">'
      + escSvgText(txt) + '</text>';
    ledX += txt.length * 8.4 + 26;
  });

  const pointsTitleY = ledgerY + 52;
  const pointLines = [];
  (r.points || []).forEach(function (p) {
    wrapByLen('· ' + p, 54).forEach(function (ln) { pointLines.push(ln); });
  });
  const pointsY = pointsTitleY + 22;
  let pointMk = '<text x="50" y="' + pointsTitleY + '" font-size="13" fill="' + T.ink2 + '">这一条要记住</text>';
  pointLines.forEach(function (line, i) {
    pointMk += '<text x="50" y="' + (pointsY + i * 19) + '" font-size="13.5" fill="' + T.ink + '">'
      + escSvgText(line) + '</text>';
  });

  const totalH = pointsY + Math.max(1, pointLines.length) * 19 + 30;

  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + totalH + '" viewBox="0 0 ' + W + ' ' + totalH + '"'
    + ' font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif">'
    + '<rect width="' + W + '" height="' + totalH + '" fill="' + T.bg + '"/>'
    + '<text x="50" y="44" font-size="15" fill="' + T.ink2 + '">化学方程式实验室 · 反应学习卡</text>'
    + '<text x="50" y="88" font-size="32" font-weight="700" fill="' + T.ink + '">' + escSvgText(r.name) + '</text>'
    + '<text x="50" y="120" font-size="15" fill="' + T.ink2 + '">'
    + escSvgText(r.type + ' · ' + r.book + ' · ' + starsFor(r.level)) + '</text>'
    + '<line x1="50" y1="136" x2="950" y2="136" stroke="' + T.line + '"/>'
    + '<rect x="50" y="152" width="900" height="48" rx="12" fill="' + T.brandSoft + '"/>'
    + '<text x="500" y="183" text-anchor="middle" font-size="22" font-weight="600" fill="' + T.brandInk + '">'
    + escSvgText(eq) + '</text>'
    + '<g transform="translate(0,' + stageTop + ')">' + stage + '</g>'
    + '<line x1="50" y1="' + (stageEnd + 16) + '" x2="950" y2="' + (stageEnd + 16) + '" stroke="' + T.line + '"/>'
    + infoMk
    + '<line x1="50" y1="' + (countsY - 20) + '" x2="950" y2="' + (countsY - 20) + '" stroke="' + T.line + '"/>'
    + '<text x="50" y="' + countsY + '" font-size="14" fill="' + T.ink2 + '">反应前 ' + escSvgText(tallyLine(L)) + '</text>'
    + '<text x="510" y="' + countsY + '" font-size="14" fill="' + T.ink2 + '">反应后 ' + escSvgText(tallyLine(R)) + '</text>'
    + ledMk
    + '<line x1="50" y1="' + (pointsTitleY - 20) + '" x2="950" y2="' + (pointsTitleY - 20) + '" stroke="' + T.line + '"/>'
    + pointMk
    + '<text x="950" y="' + (totalH - 14) + '" text-anchor="end" font-size="12" fill="' + T.ink2 + '">化学方程式实验室 v2.5 · 2026-11-08</text>'
    + '</svg>';

  const V = exportVarMap(T);
  return svg.replace(/var\((--[a-z0-9-]+)\)/g, function (m, k) { return V[k] || T.ink2; });
}

function exportReactionCard(r) {
  const svgStr = buildExportSvg(r);
  if (!svgStr) return;
  const m = svgStr.match(/height="(\d+)"/);
  const h = m ? Number(m[1]) : 900;
  const scale = 2;
  const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = function () {
    const cv = document.createElement('canvas');
    cv.width = 1000 * scale;
    cv.height = h * scale;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
    URL.revokeObjectURL(url);
    const a = document.createElement('a');
    a.download = '化学方程式实验室-' + r.name.replace(/[\\/:*?"<>|]/g, '') + '.png';
    a.href = cv.toDataURL('image/png');
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  };
  img.onerror = function () {
    URL.revokeObjectURL(url);
    alert('图片生成失败，请再试一次。');
  };
  img.src = url;
}

/* ============================================================
   ⑦ 详情页
   ============================================================ */
function valenceRow(sp) {
  if (!sp.valence) return '';
  const order = Object.keys(sp.valence).filter(function (el) {
    return sp.valence[el] !== undefined && sp.valence[el] !== 0;
  });
  if (!order.length) return '';
  const items = order.map(function (el) {
    const v = sp.valence[el];
    const t = v > 0 ? '+' + v : '−' + Math.abs(v);
    return '<span class="vitem">' + el + ' <b>' + t + '</b></span>';
  }).join('');
  return '<div class="valrow"><span class="vtag">价</span>' + items + '</div>';
}

function bondSymbol(order) {
  return order === 3 ? '≡' : order === 2 ? '=' : '–';
}

function bondName(order) {
  return order === 3 ? '三键' : order === 2 ? '双键' : '单键';
}

function bondGroups(sp) {
  const rank = { C: 0, O: 1 };
  const map = {};
  sp.bonds.forEach(function (b) {
    if (b[2] === -1) return;
    let a = sp.atoms[b[0]].el;
    let z = sp.atoms[b[1]].el;
    const ra = rank[a] === undefined ? 9 : rank[a];
    const rz = rank[z] === undefined ? 9 : rank[z];
    if (rz < ra) { const t = a; a = z; z = t; }
    const key = a + '|' + z + '|' + b[2];
    if (!map[key]) map[key] = { a: a, z: z, o: b[2], n: 0 };
    map[key].n++;
  });
  return Object.keys(map).map(function (k) { return map[k]; });
}

function bondTexts(sp) {
  if (sp.kind === 'ionic') {
    if (!sp.ions) return ['离子键'];
    return [sp.ions.map(function (it) {
      return it[0] + (it[1] > 1 ? ' ×' + it[1] : '');
    }).join(' + ') + ' · 离子键' + (sp.inner ? '（' + sp.inner + '）' : '')];
  }
  if (sp.kind === 'atom') {
    if (sp.formula === 'C') return ['共价键 · 空间网状结构'];
    if (sp.formula === 'P') return ['共价键 · 空间网状结构（红磷）'];
    return ['金属键 · 阳离子 + 自由电子'];
  }
  return bondGroups(sp).map(function (g) {
    return g.a + bondSymbol(g.o) + g.z + ' ' + bondName(g.o) + (g.n > 1 ? ' ×' + g.n : '');
  });
}

function bondSummary(sp) {
  if (sp.kind === 'ionic') return '离子键';
  if (sp.kind === 'atom') return (sp.formula === 'C' || sp.formula === 'P') ? '共价键' : '金属键';
  return bondGroups(sp).map(function (g) {
    return g.a + bondSymbol(g.o) + g.z + ' ' + bondName(g.o);
  }).join('、');
}

function bondRow(sp) {
  const texts = sp.bondNote ? [sp.bondNote] : bondTexts(sp);
  if (!texts.length) return '';
  return '<div class="bondrow"><span class="btag">键</span>'
    + texts.map(function (t) { return '<span class="bitem">' + t + '</span>'; }).join('')
    + '</div>';
}

function speciesFigure(item) {

    + '<span class="fml">' + sp.formula + (item.mark || '') + '</span>'
    + '<span class="nm">' + sp.name + '</span>'
    + '</figcaption>'
    + (state.showVal ? valenceRow(sp) : '')

    + '</figure>';
}

function ledgerRowItemsHtml(L, R) {

/* ============================================================
   ⑧ 配平工作台
   系数从 1 起步，点击加减；账本按当前系数实时统计
   ============================================================ */
const BAL = { id: null, L: [], R: [] };
const COEF_MIN = 1;
const COEF_MAX = 9;

function gcd(a, b) {
  while (b) { const t = a % b; a = b; b = t; }
  return a;
}

function balStart(id) {
  const r = REACTIONS.find(function (x) { return x.id === id; });
  if (!r) return null;
  if (BAL.id !== id) {
    BAL.id = id;
    BAL.L = r.left.map(function () { return 1; });
    BAL.R = r.right.map(function () { return 1; });
    const allOne = r.left.every(function (it) { return it.coef === 1; })
      && r.right.every(function (it) { return it.coef === 1; });
    if (allOne && !balCheck(r).bad.length && BAL.R.length) {
      BAL.R[BAL.R.length - 1] = 2;
    }
  }
  return r;
}

function balItems(r) {
  return {
    left: r.left.map(function (it, i) { return { sp: it.sp, coef: BAL.L[i], mark: it.mark }; }),
    right: r.right.map(function (it, i) { return { sp: it.sp, coef: BAL.R[i], mark: it.mark }; })
  };
}

function balCheck(r) {
  const items = balItems(r);
  const L = countAtoms(items.left);
  const R = countAtoms(items.right);
  const keys = Object.keys(L);
  Object.keys(R).forEach(function (k) { if (keys.indexOf(k) === -1) keys.push(k); });
  const bad = keys.filter(function (k) { return (L[k] || 0) !== (R[k] || 0); });
  const g = BAL.L.concat(BAL.R).reduce(gcd);
  return { L: L, R: R, keys: keys, bad: bad, gcd: g };
}

function coefStepper(side, i, val) {
  return '<div class="coefbox">'
    + '<button class="cbtn" data-side="' + side + '" data-i="' + i + '" data-dir="-1"'
    + (val <= COEF_MIN ? ' disabled' : '') + ' aria-label="系数减一">−</button>'
    + '<span class="cval">' + val + '</span>'
    + '<button class="cbtn" data-side="' + side + '" data-i="' + i + '" data-dir="1"'
    + (val >= COEF_MAX ? ' disabled' : '') + ' aria-label="系数加一">+</button>'
    + '</div>';
}

function balFigure(item, side, i) {
  const sp = SPECIES[item.sp];
  const val = side === 'L' ? BAL.L[i] : BAL.R[i];
  return '<figure class="sp">'
    + coefStepper(side, i, val)
    + '<div class="sp-art">' + svgFor(item.sp, { scale: 28 }) + '</div>'
    + '<figcaption><span class="fml">' + sp.formula + (item.mark || '') + '</span><span class="nm">' + sp.name + '</span></figcaption>'
    + valenceRow(sp)
    + bondRow(sp)
    + '</figure>';
}

function balLedger(c) {
  const rows = c.keys.map(function (el) {
    const a = c.L[el] || 0;
    const b = c.R[el] || 0;
    const same = a === b;
    return '<div class="lrow ' + (same ? 'ok' : 'bad') + '">'
      + '<span class="lel">' + el + '</span>'
      + '<span class="num">左 ' + a + '</span>'
      + '<span>' + (same ? '＝' : '≠') + '</span>'
      + '<span class="num">右 ' + b + '</span>'
      + '<span class="tick">' + (same ? '✓' : '✗ 差 ' + Math.abs(a - b)) + '</span>'
      + '</div>';
  }).join('');

  return '<div class="ledger">'
    + '<div class="ledger-title">原子账本 · 每种原子的个数必须相等</div>'
    + '<div class="lrows">' + rows + '</div>'
    + '</div>';
}

function balFeedback(c) {
  if (c.bad.length) {
    return '<div class="bfb bad" role="status" aria-live="polite">还有 ' + c.bad.length + ' 种原子没有配平：'
      + c.bad.join('、') + '。先让它们的个数相等。</div>';
  }
  if (c.gcd > 1) {
    return '<div class="bfb warn" role="status" aria-live="polite">原子个数都相等了，但所有系数还能同时除以 '
      + c.gcd + '，试着再化简一次。</div>';
  }
  return '<div class="bfb good" role="status" aria-live="polite">配平成功！系数 '
    + BAL.L.concat(BAL.R).join(' : ') + '，已是最简整数比。</div>';
}

function renderBalance(id, keepScroll) {
  const r = balStart(id);
  const view = document.getElementById('view');
  if (!r) { renderList(); return; }

  const c = balCheck(r);
  const leftFigures = r.left.map(function (it, i) { return balFigure(it, 'L', i); }).join('');
  const rightFigures = r.right.map(function (it, i) { return balFigure(it, 'R', i); }).join('');

  view.innerHTML =
    '<div class="detail-head sticky-head">'
    + '<button class="back" data-back="1">← 全部反应</button>'
    + '<h2>配平工作台</h2>'
    + '<div class="meta"><span class="tag">' + r.type + '</span><span>' + r.name + '</span></div>'
    + '<div class="head-btns">'
    + '<label class="switch" title="显示 / 隐藏化合价；化合物中各元素正负代数和为 0"><input type="checkbox" data-val-toggle'
    + (state.showVal ? ' checked' : '') + ' aria-label="显示化合价"><span>显示化合价</span></label>'
    + '<button class="btn" data-detail="' + r.id + '">返回详情</button>'
    + '</div>'
    + '</div>'
    + '<p class="hintline">系数就是分子个数。用 − / + 改系数，让下方每种原子的左、右个数相等。</p>'

    + '<div class="stage">'
    + '<div class="pane">'
    + '<div class="pane-title">反应物</div>'
    + '<div class="species-wrap' + (r.left.length >= 3 ? ' many' : '') + '">' + leftFigures + '</div>'
    + '</div>'
    + '<div class="arrow-col">'
    + '<span class="cond">' + r.cond + '</span>'
    + '<svg class="arrow-svg" width="72" height="20" viewBox="0 0 72 20" fill="none">'
    + '<path d="M2 10h60" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'
    + '<path d="M54 3l9 7-9 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'
    + '</svg>'
    + '</div>'
    + '<div class="pane">'
    + '<div class="pane-title">生成物</div>'
    + '<div class="species-wrap' + (r.right.length >= 3 ? ' many' : '') + '">' + rightFigures + '</div>'
    + '</div>'
    + '</div>'

    + balFeedback(c)
    + balLedger(c)

    + '<div class="bbtns">'
    + '<button class="btn" data-reset="1">重来</button>'
    + '<button class="btn" data-answer="1">显示答案</button>'
    + '</div>';

  if (!keepScroll) window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ============================================================
   ⑨ 拆解动画
   左边原子按元素自动配对到右边位置，多出的原子留在原地
   ============================================================ */
const ANIM = {
  id: null, mode: 'ok', t: 0, dur: 4200, stopAt: 0,
  playing: false, raf: 0, last: 0, scene: null, phase: -1, flashKey: '',
  bounds: [0, 900, 2500, 3200, 4200]
};

/* 时间轴：拆开 → 迁移 → 重组 → 守恒 */
const ANIM_T = { explode: 900, migrate: 2500, combine: 3200, badDur: 4200 };
const ANIM_FLASH = 400;   // 守恒阶段每种元素闪多久
const ANIM_TAIL = 500;    // 最后全部轻闪一下
const ANIM_PUSH = 22;     // 预组合位置：从生成物位置向外推多少 px

function animBounds(sc) {
  const n = (sc && sc.elements) ? sc.elements.length : 2;
  const end = (sc && sc.mode === 'bad')
    ? ANIM_T.badDur
    : ANIM_T.combine + n * ANIM_FLASH + ANIM_TAIL;
  return [0, ANIM_T.explode, ANIM_T.migrate, ANIM_T.combine, end];
}

function animHalt() {
  ANIM.playing = false;
  if (ANIM.raf) cancelAnimationFrame(ANIM.raf);
  ANIM.raf = 0;
}

function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
function easeInOut(v) { return v < 0.5 ? 2 * v * v : 1 - Math.pow(-2 * v + 2, 2) / 2; }

function animBox(sp) {
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  sp.atoms.forEach(function (a) {
    minX = Math.min(minX, a.x - 0.75);
    maxX = Math.max(maxX, a.x + 0.75);
    minY = Math.min(minY, a.y - 0.75);
    maxY = Math.max(maxY, a.y + 0.75);
  });
  return { w: maxX - minX, h: maxY - minY, ox: (minX + maxX) / 2, oy: (minY + maxY) / 2 };
}

function animPack(keys, maxW, k) {
  const gap = 16;
  const mols = keys.map(function (key) {
    const sp = SPECIES[key];
    const b = animBox(sp);
    return { sp: sp, box: b, w: b.w * k, h: b.h * k };
  });

  let x = 0, y = 0, rowH = 0, blockW = 0;
  mols.forEach(function (m) {
    if (x > 0 && x + m.w > maxW) { x = 0; y += rowH + gap; rowH = 0; }
    m.px = x;
    m.py = y;
    x += m.w + gap;
    rowH = Math.max(rowH, m.h);
    blockW = Math.max(blockW, x - gap);
  });

  return { mols: mols, blockW: blockW, blockH: y + rowH, k: k };
}

function animPlace(pack, zoneX, zoneW, topY) {
  const offX = zoneX + (zoneW - pack.blockW) / 2;
  pack.mols.forEach(function (m) {
    m.cx = offX + m.px + m.w / 2;
    m.cy = topY + m.py + m.h / 2;
    m.k = pack.k;
  });
  return pack;
}

function animSide(mols) {
  const atoms = [];
  const bonds = [];
  mols.forEach(function (m) {
    const base = atoms.length;
    m.sp.atoms.forEach(function (a) {
      const rr = EL[a.el].r * m.k / 30;
      atoms.push({
        el: a.el,
        r: rr,
        fs: Math.min(15, Math.max(11, rr * 0.92)),
        x: m.cx + (a.x - m.box.ox) * m.k,
        y: m.cy + (a.y - m.box.oy) * m.k,
        mx: m.cx,
        my: m.cy,
        paired: true
      });
    });
    m.sp.bonds.forEach(function (b) {
      bonds.push({ a: base + b[0], b: base + b[1], order: b[2] });
    });
  });
  return { atoms: atoms, bonds: bonds };
}

function tally(list) {
  const m = {};
  list.forEach(function (a) { m[a.el] = (m[a.el] || 0) + 1; });
  return m;
}

function tallyText(m) {
  const keys = Object.keys(m);
  if (!keys.length) return '无';
  return keys.map(function (k) { return k + ' ' + m[k]; }).join(' · ');
}

/* 动画里的原子计数按原子序数排，和守恒点名的顺序保持一致 */
function animTallyText(m, els) {
  const list = (els || Object.keys(m)).filter(function (k) { return m[k]; });
  return list.length ? list.map(function (k) { return k + ' ' + m[k]; }).join(' · ') : '无';
}

function tallyEqual(a, b) {
  const keys = Object.keys(a);
  Object.keys(b).forEach(function (k) { if (keys.indexOf(k) === -1) keys.push(k); });
  return keys.every(function (k) { return (a[k] || 0) === (b[k] || 0); });
}

function sideBondSummary(items) {
  const out = [];
  items.forEach(function (it) {
    bondSummary(SPECIES[it.sp]).split('、').forEach(function (t) {
      if (out.indexOf(t) === -1) out.push(t);
    });
  });
  return out.join('、');
}

/* 方程式换行：优先在箭头处断，其次在空格处断，避免把 BaSO₄ 这类化学式拆开 */
function wrapBySpaces(text, maxChars) {
  const parts = text.split(' ');
  const lines = [];
  let line = '';
  parts.forEach(function (p) {
    if (!line) { line = p; return; }
    if ((line + ' ' + p).length <= maxChars) line += ' ' + p;
    else { lines.push(line); line = p; }
  });
  if (line) lines.push(line);
  return lines;
}

function wrapEq(text, maxChars) {
  if (text.length <= maxChars) return [text];
  const m = text.match(/^(.*?)( —[^→]*→ )(.*)$/);
  if (m && (m[1] + m[2]).trim().length <= maxChars) {
    const lines = [(m[1] + m[2]).replace(/\s+$/, '')];
    wrapBySpaces(m[3], maxChars).forEach(function (l) { lines.push(l); });
    return lines;
  }
  return wrapBySpaces(text, maxChars);
}

function animScene(r, mode, narrow, opts) {
  opts = opts || {};
  const withEq = !opts.noEq;
  const withLabels = !opts.noLabels;
  const badSide = opts.badSide || 'right';
  const W = narrow ? 520 : 1000;
  const zoneW = narrow ? 460 : 350;
  const leftX = 30;
  const rightX = narrow ? 30 : 620;

  const badRight = mode === 'bad' && badSide === 'right';
  const badLeft = mode === 'bad' && badSide === 'left';
  const rightCoefs = badRight
    ? r.right.map(function () { return 1; })
    : r.right.map(function (it) { return it.coef; });
  const leftCoefs = badLeft
    ? r.left.map(function () { return 1; })
    : r.left.map(function (it) { return it.coef; });

  const leftKeys = [];
  const rightKeys = [];
  r.left.forEach(function (it, i) {
    for (let c = 0; c < leftCoefs[i]; c++) leftKeys.push(it.sp);
  });
  r.right.forEach(function (it, i) {
    for (let c = 0; c < rightCoefs[i]; c++) rightKeys.push(it.sp);
  });

  /* 单个分子比一个分区还宽时，整场等比缩小，避免被画布裁掉 */
  let maxBoxW = 1;
  leftKeys.concat(rightKeys).forEach(function (key) {
    maxBoxW = Math.max(maxBoxW, animBox(SPECIES[key]).w);
  });
  const k = Math.min(40, (zoneW - 6) / maxBoxW);

  const PL0 = animPack(leftKeys, zoneW, k);
  const PR0 = animPack(rightKeys, zoneW, k);

  /* 方程式画进舞台顶部，省掉页面里单独一行 */
  let eq = null;
  let eqH = 0;
  if (withEq) {
    const eqLeft = badLeft
      ? r.left.map(function (it) { return { sp: it.sp, coef: 1, mark: it.mark }; })
      : r.left;
    const eqRight = badRight
      ? r.right.map(function (it) { return { sp: it.sp, coef: 1, mark: it.mark }; })
      : r.right;
    const text = sideText(eqLeft) + ' —' + r.cond + '→ ' + sideText(eqRight);
    const maxChars = narrow ? 30 : 60;
    const lines = wrapEq(text, maxChars);
    const fs = narrow ? 16.5 : (text.length > 46 ? 14.5 : 16.5);
    const lh = 21;
    eq = { text: text, lines: lines, fs: fs, lh: lh, top: 6, pad: 16 };
    eqH = lines.length * lh + 12;
  }

  let H, leftTop, rightTop, labels = [], arrow;
  const topPad = eqH ? eqH + 8 : 0;
  if (narrow) {
    leftTop = Math.max(56, topPad);
    rightTop = leftTop + PL0.blockH + 140;
    H = Math.max(440, rightTop + PR0.blockH + 60);
    const y1 = leftTop + PL0.blockH + 40;
    const y2 = rightTop - 24;
    if (withLabels) {
      labels = [
        { x: 260, y: leftTop + PL0.blockH + 19, text: '反应物', anchor: 'middle' },
        { x: 260, y: rightTop + PR0.blockH + 19, text: '生成物', anchor: 'middle' }
      ];
    }
    arrow = { vertical: true, x1: 260, y1: y1, y2: y2, mid: (y1 + y2) / 2 };
  } else {
    H = Math.max(340, Math.max(PL0.blockH, PR0.blockH) + 210);
    leftTop = Math.max(56, topPad, (H - PL0.blockH) / 2 - 24);
    rightTop = Math.max(56, topPad, (H - PR0.blockH) / 2 - 24);
    if (withLabels) {
      const labelY = Math.max(leftTop + PL0.blockH, rightTop + PR0.blockH) + 20;
      labels = [
        { x: leftX + zoneW / 2, y: labelY, text: '反应物', anchor: 'middle' },
        { x: rightX + zoneW / 2, y: labelY, text: '生成物', anchor: 'middle' }
      ];
    }
    arrow = { vertical: false, x1: 470, x2: 528, mid: (leftTop + PL0.blockH / 2 + rightTop + PR0.blockH / 2) / 2 };
    const need = Math.max(leftTop + PL0.blockH, rightTop + PR0.blockH) + 110;
    if (H < need) H = need;
  }

  const PL = animPlace(PL0, leftX, zoneW, leftTop);
  const PR = animPlace(PR0, rightX, zoneW, rightTop);
  const L = animSide(PL.mols);
  const R = animSide(PR.mols);

  const byEl = {};
  R.atoms.forEach(function (a) {
    (byEl[a.el] = byEl[a.el] || []).push(a);
    // 预组合位置：从生成物位置沿远离分子中心方向外推，迁移阶段停在这里
    const dx = a.x - a.mx;
    const dy = a.y - a.my;
    const d = Math.hypot(dx, dy);
    a.px = d > 1 ? a.x + dx / d * ANIM_PUSH : a.x;
    a.py = d > 1 ? a.y + dy / d * ANIM_PUSH : a.y;
    a.owner = null;
  });

  const leftover = [];
  L.atoms.forEach(function (a) {
    a.sx = a.x;
    a.sy = a.y;
    const dx = a.x - a.mx;
    const dy = a.y - a.my;
    const d = Math.hypot(dx, dy);
    if (d > 1) { a.sx = a.x + dx / d * 16; a.sy = a.y + dy / d * 16; }

    const list = byEl[a.el];
    if (list && list.length) {
      const t = list.shift();
      a.tx = t.x;
      a.ty = t.y;
      a.px = t.px;
      a.py = t.py;
      t.owner = a;
    } else {
      a.paired = false;
      a.tx = a.sx;
      a.ty = a.sy;
      a.px = a.sx;
      a.py = a.sy;
      leftover.push(a);
    }
  });

  L.bonds.forEach(function (b) { b.side = 'L'; });
  R.bonds.forEach(function (b) {
    b.side = 'R';
    b.a += L.atoms.length;
    b.b += L.atoms.length;
  });

  const leftCounts = tally(L.atoms);
  const rightCounts = tally(R.atoms);
  const missing = R.atoms.filter(function (t) { return !t.owner; });
  const leftItems = r.left.map(function (it, i) { return { sp: it.sp, coef: leftCoefs[i], mark: it.mark }; });
  const rightItems = r.right.map(function (it, i) { return { sp: it.sp, coef: rightCoefs[i], mark: it.mark }; });

  const elKeys = Object.keys(leftCounts);
  Object.keys(rightCounts).forEach(function (el) {
    if (elKeys.indexOf(el) === -1) elKeys.push(el);
  });

  return {
    W: W, H: Math.round(H), narrow: narrow, r: r, mode: mode, badSide: badSide,
    labels: labels, arrow: arrow, eq: eq,
    leftBondText: sideBondSummary(r.left),
    rightBondText: sideBondSummary(r.right),
    hasIonic: r.left.concat(r.right).some(function (it) { return SPECIES[it.sp].kind === 'ionic'; }),
    atoms: L.atoms,
    targets: R.atoms,
    bonds: L.bonds.concat(R.bonds),
    leftCounts: leftCounts,
    rightCounts: rightCounts,
    leftItems: leftItems,
    rightItems: rightItems,
    missing: missing,
    missingCounts: tally(missing),
    elements: elKeys.sort(function (x, y) {
      return (ATOMIC_NO[x] || 999) - (ATOMIC_NO[y] || 999);
    }),
    leftover: leftover,
    leftoverCounts: tally(leftover)
  };
}

function animSvg(sc) {
  const r = sc.r;
  let pre = '';
  sc.labels.forEach(function (l) {
    pre += '<text x="' + l.x + '" y="' + l.y + '" font-size="13" fill="var(--ink-2)"'
      + (l.anchor ? ' text-anchor="' + l.anchor + '"' : '') + '>' + l.text + '</text>';
  });

  /* 舞台顶部的方程式（无底色框，文字居中） */
  let eqMk = '';
  if (sc.eq) {
    eqMk = '<g id="scene-eq">';
    sc.eq.lines.forEach(function (line, i) {
      eqMk += '<text x="' + (sc.W / 2) + '" y="' + (sc.eq.top + sc.eq.pad + i * sc.eq.lh)
        + '" text-anchor="middle" font-size="' + sc.eq.fs
        + '" font-weight="600" fill="var(--brand-ink)">' + escSvgText(line) + '</text>';
    });
    eqMk += '</g>';
  }

  if (sc.arrow.vertical) {
    const a = sc.arrow;
    pre += '<path d="M' + a.x1 + ' ' + a.y1 + ' V' + a.y2 + '" stroke="var(--brand)" stroke-width="2.5" stroke-linecap="round"/>'
      + '<path d="M' + (a.x1 - 9) + ' ' + (a.y2 - 12) + ' l9 12 9 -12" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'
      + '<text x="' + (a.x1 + 16) + '" y="' + (a.mid + 5) + '" font-size="13" fill="var(--ink-2)">' + r.cond + '</text>';
  } else {
    pre += '<path d="M' + sc.arrow.x1 + ' ' + sc.arrow.mid + ' H' + sc.arrow.x2 + '" stroke="var(--brand)" stroke-width="2.5" stroke-linecap="round"/>'
      + '<path d="M' + (sc.arrow.x2 - 12) + ' ' + (sc.arrow.mid - 9) + ' l12 9 -12 9" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'
      + '<text x="500" y="' + (sc.arrow.mid - 18) + '" text-anchor="middle" font-size="13" fill="var(--ink-2)">' + r.cond + '</text>';
  }

  let bondMk = '';
  sc.bonds.forEach(function (b, i) {
    const A = b.a < sc.atoms.length ? sc.atoms[b.a] : sc.targets[b.a - sc.atoms.length];
    const B = b.b < sc.atoms.length ? sc.atoms[b.b] : sc.targets[b.b - sc.atoms.length];
    const offs = b.order === 3 ? [-8, 0, 8] : b.order === 2 ? [-5, 5] : [0];
    const dash = b.order === -1 ? ' stroke-dasharray="5 6"' : '';
    offs.forEach(function (off) {
      bondMk += '<line data-b="' + i + '" data-off="' + off + '" x1="' + A.x + '" y1="' + A.y
        + '" x2="' + B.x + '" y2="' + B.y + '"'
        + ' stroke="' + (b.order === -1 ? 'var(--ionic)' : 'var(--bond)') + '"'
        + ' stroke-width="' + (b.order === -1 ? 1.6 : 2.2) + '" stroke-linecap="round"'
        + ' opacity="0"' + dash + '/>';
    });
  });

  let atomMk = '';
  sc.atoms.forEach(function (a, i) {
    atomMk += '<g data-a="' + i + '" transform="translate(' + a.sx + ',' + a.sy + ')">'
      + '<circle class="glow" r="' + (a.r + 6) + '" fill="none" stroke="var(--ok)" stroke-width="3" opacity="0"/>'
      + '<circle class="strand" r="' + (a.r + 5) + '" fill="none" stroke="#C8372A" stroke-width="2" opacity="0"/>'
      + '<circle r="' + a.r + '" fill="' + EL[a.el].fill + '" stroke="' + EL[a.el].stroke + '" stroke-width="1.3"/>'
      + '<text text-anchor="middle" dominant-baseline="central" font-size="' + a.fs
      + '" font-weight="600" fill="' + EL[a.el].ink + '">' + a.el + '</text>'
      + '</g>';
  });

  // 预览态：把生成物原子也画在终点，让入口看起来像静态分子图；播放后随第一阶段淡出
  let ghostMk = '';
  sc.targets.forEach(function (a, i) {
    if (!a.owner) return;
    ghostMk += '<g class="ghost" data-t="' + i + '" transform="translate(' + a.x + ',' + a.y + ')">'
      + '<circle r="' + a.r + '" fill="' + EL[a.el].fill + '" stroke="' + EL[a.el].stroke + '" stroke-width="1.3"/>'
      + '<text text-anchor="middle" dominant-baseline="central" font-size="' + a.fs
      + '" font-weight="600" fill="' + EL[a.el].ink + '">' + a.el + '</text></g>';
  });

  // 反应物少写时：生成物里没有被填上的位置画成红色虚线空位
  let missMk = '';
  (sc.missing || []).forEach(function (a, i) {
    missMk += '<g class="missing" data-m="' + i + '" transform="translate(' + a.x + ',' + a.y + ')">'
      + '<circle r="' + a.r + '" fill="none" stroke="var(--danger)" stroke-width="2" stroke-dasharray="5 5"/>'
      + '<text text-anchor="middle" dominant-baseline="central" font-size="' + a.fs
      + '" font-weight="700" fill="var(--danger)">?</text></g>';
  });

  return '<svg class="anim-svg" viewBox="0 0 ' + sc.W + ' ' + sc.H + '"'
    + ' role="img" aria-label="' + r.name + '的原子拆解动画">'
    + eqMk + pre + '<g id="anim-bonds">' + bondMk + '</g><g id="anim-ghosts">' + ghostMk + '</g>'
    + (missMk ? '<g id="anim-missing">' + missMk + '</g>' : '')
    + '<g id="anim-atoms">' + atomMk + '</g>'
    + '</svg>';
}

function animCaption(sc, ph) {
  if (ph === 0) return '拆开分子：' + sc.leftBondText + ' 这些键要断开，原子或离子先从原来的位置散开。';
  if (ph === 1) {
    let t = '原子迁移：' + sc.leftBondText + ' 已经断开，原子或离子保持拆开的状态飞向生成物一侧，还没有连成新分子。';
    if (sc.hasIonic) t += ' 离子化合物拆开的是离子间的静电作用，不是分子。';
    return t;
  }
  if (ph === 2) return '重新组合：原子现在才各自就位，新的键开始形成 —— 生成物这边是 ' + sc.rightBondText + '。';
  if (sc.mode === 'bad' && sc.badSide === 'left' && sc.missing.length) {
    return '右边还有 ' + tallyText(sc.missingCounts) + ' 没有原子来源 —— 左边少写了系数，这个式子就没配平。';
  }
  if (sc.mode === 'bad' && sc.leftover.length) {
    return '左边还剩 ' + tallyText(sc.leftoverCounts) + ' 没有地方去 —— 原子数不相等，这个式子就没配平。';
  }
  return '原子守恒：逐个点名，看看反应前后每种原子是不是一样多。';
}

function animPaint(t) {
  const sc = ANIM.scene;
  if (!sc) return;

  const pe = easeInOut(clamp01(t / ANIM_T.explode));
  const pm = easeInOut(clamp01((t - ANIM_T.explode) / (ANIM_T.migrate - ANIM_T.explode)));
  const pr = easeInOut(clamp01((t - ANIM_T.migrate) / (ANIM_T.combine - ANIM_T.migrate)));
  const pb = clamp01((t - (ANIM_T.combine - 550)) / 550);
  const stranded = t >= ANIM_T.combine;

  // 守恒阶段：按元素逐批点名（只在正确配平的模式里）
  const els = sc.elements || [];
  const flashRel = t - ANIM_T.combine;
  let flashEl = '', flashIdx = -1, tail = false, pulse = 0;
  if (sc.mode === 'ok' && flashRel >= 0) {
    const span = els.length * ANIM_FLASH;
    if (flashRel < span) {
      flashIdx = Math.min(els.length - 1, Math.floor(flashRel / ANIM_FLASH));
      flashEl = els[flashIdx];
      pulse = Math.sin(Math.PI * clamp01((flashRel - flashIdx * ANIM_FLASH) / ANIM_FLASH));
    } else {
      tail = true;
      pulse = Math.sin(Math.PI * clamp01((flashRel - span) / ANIM_TAIL)) * 0.55;
    }
  }

  sc.atoms.forEach(function (a) {
    const sx = a.x + (a.sx - a.x) * pe;
    const sy = a.y + (a.sy - a.y) * pe;
    const x = sx + (a.px - sx) * pm + (a.tx - a.px) * pr;
    const y = sy + (a.py - sy) * pm + (a.ty - a.py) * pr;
    a.cxNow = x;
    a.cyNow = y;

    const hit = (flashEl && a.el === flashEl) || tail;
    const scale = 1 + (hit ? 0.16 * pulse : 0);
    a.g.setAttribute('transform', 'translate(' + x.toFixed(1) + ',' + y.toFixed(1)
      + ') scale(' + scale.toFixed(3) + ')');
    if (a.glow) a.glow.setAttribute('opacity', hit ? Math.min(1, pulse * 1.25).toFixed(3) : '0');
    if (a.ring) a.ring.setAttribute('opacity', (!a.paired && stranded) ? '0.9' : '0');
  });

  const ghostOp = Math.max(0, 1 - pe).toFixed(3);
  Array.prototype.forEach.call(document.querySelectorAll('#anim-ghosts .ghost'), function (g) {
    g.setAttribute('opacity', ghostOp);
  });

  sc.bonds.forEach(function (b) {
    const isL = b.side === 'L';
    const A = b.a < sc.atoms.length ? sc.atoms[b.a] : sc.targets[b.a - sc.atoms.length];
    const B = b.b < sc.atoms.length ? sc.atoms[b.b] : sc.targets[b.b - sc.atoms.length];
    // 右侧键跟随配对原子当前位置，避免原子还在收拢、键已钉在终点；
    // 但预览/拆解第一阶段右键还没形成，固定画在生成物终点上
    const useTarget = !isL && pb <= 0;
    const ap = useTarget ? A : (A.cxNow !== undefined ? A : (A.owner || A));
    const bp = useTarget ? B : (B.cxNow !== undefined ? B : (B.owner || B));
    const ax = useTarget ? A.x : (ap.cxNow !== undefined ? ap.cxNow : A.x);
    const ay = useTarget ? A.y : (ap.cyNow !== undefined ? ap.cyNow : A.y);
    const bx = useTarget ? B.x : (bp.cxNow !== undefined ? bp.cxNow : B.x);
    const by = useTarget ? B.y : (bp.cyNow !== undefined ? bp.cyNow : B.y);
    const dx = bx - ax;
    const dy = by - ay;
    const len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len;
    const ny = dx / len;
    // 初始预览态右侧键也可见；拆解第一阶段随左键一起淡出，重组时再出现
    const op = (isL ? (1 - pe) : (pb > 0 ? pb : 1 - pe)).toFixed(3);
    b.lines.forEach(function (ln) {
      ln.el.setAttribute('x1', (ax + nx * ln.off).toFixed(1));
      ln.el.setAttribute('y1', (ay + ny * ln.off).toFixed(1));
      ln.el.setAttribute('x2', (bx + nx * ln.off).toFixed(1));
      ln.el.setAttribute('y2', (by + ny * ln.off).toFixed(1));
      ln.el.setAttribute('opacity', op);
    });
  });

  const ph = t < ANIM_T.explode ? 0 : t < ANIM_T.migrate ? 1 : t < ANIM_T.combine ? 2 : 3;
  const cap = document.getElementById('anim-caption');
  if (ph !== ANIM.phase) {
    ANIM.phase = ph;
    ANIM.flashKey = '';
    Array.prototype.forEach.call(document.querySelectorAll('#anim-phases .phasechip'), function (c, i) {
      c.classList.toggle('on', i === ph);
    });
    if (cap) cap.innerHTML = animCaption(sc, ph);
  }

  if (ph === 3 && sc.mode === 'ok') {
    const key = flashEl ? 'e' + flashIdx : (tail ? 'tail' : '');
    if (key && key !== ANIM.flashKey) {
      ANIM.flashKey = key;
      if (cap) {
        if (flashEl) {
          cap.innerHTML = '点名 <b>' + flashEl + '</b>：反应前 ' + (sc.leftCounts[flashEl] || 0)
            + ' 个，反应后 ' + (sc.rightCounts[flashEl] || 0) + ' 个。';
        } else {
          cap.innerHTML = '全部原子都在：' + animTallyText(sc.leftCounts, sc.elements) + '。';
        }
      }
    }
  }
}

function updatePlayLabel() {
  const b = document.querySelector('[data-play]');
  if (b) b.textContent = ANIM.playing ? '暂停' : (ANIM.t >= ANIM.dur ? '重播' : '播放');
  updateInlineFull();
}

/* 详情页内嵌动画：完整播放按钮文案 + 模式按钮 + 两个舞台的显隐 */
function updateInlineFull() {
  const b = document.querySelector('[data-full-anim]');
  if (!b) return;
  b.textContent = ANIM.playing ? '暂停'
    : (ANIM.t >= ANIM.dur ? '重播完整动画' : (ANIM.t > 0 ? '继续播放' : '看完整动画'));
}

function updateModeBtn() {
  const b = document.querySelector('[data-mode]');
  if (b) b.textContent = ANIM.mode === 'bad' ? '回到正确配平' : '不配平会怎样';
}

/* 回到入口预览：暂停、t=0、无阶段高亮、字幕与按钮复位 */
function showAnimPreview() {
  animHalt();
  ANIM.t = 0;
  ANIM.phase = -1;
  ANIM.flashKey = '';
  if (ANIM.scene) animPaint(0);
  ANIM.phase = -1;
  Array.prototype.forEach.call(document.querySelectorAll('#anim-phases .phasechip'), function (c) {
    c.classList.remove('on');
  });
  const cap = document.getElementById('anim-caption');
  if (cap) {
    cap.textContent = '这是反应前的状态：左边是反应物，右边是生成物。点「看完整动画」看原子怎么搬家。';
  }
  updateInlineFull();
}

function animSeek(i) {
  const b = ANIM.bounds;
  ANIM.t = b[i] || 0;
  ANIM.phase = -1;
  ANIM.flashKey = '';
  animPaint(ANIM.t);
  // 最后一段播到结尾；前三段停在段末前一瞬，避免芯片提前跳到下一段
  animPlay(i >= 3 ? b[4] : b[i + 1] - 1);
}

function animPlay(stopAt) {
  if (!ANIM.scene) return;
  if (ANIM.t >= ANIM.dur) {
    ANIM.t = 0;
    ANIM.phase = -1;
    ANIM.flashKey = '';
    animPaint(0);
  }
  ANIM.stopAt = typeof stopAt === 'number' ? stopAt : ANIM.dur;
  if (ANIM.stopAt > ANIM.dur) ANIM.stopAt = ANIM.dur;
  ANIM.playing = true;
  ANIM.last = performance.now();
  updatePlayLabel();
  if (ANIM.raf) cancelAnimationFrame(ANIM.raf);
  ANIM.raf = requestAnimationFrame(animTick);
}

function animPause() {
  ANIM.playing = false;
  if (ANIM.raf) cancelAnimationFrame(ANIM.raf);
  ANIM.raf = 0;
  updatePlayLabel();
}

function animTick(now) {
  if (!ANIM.playing) return;
  const dt = Math.min(64, now - ANIM.last);
  ANIM.last = now;
  ANIM.t += dt;
  if (ANIM.t >= ANIM.stopAt) {
    ANIM.t = ANIM.stopAt;
    ANIM.playing = false;
    ANIM.raf = 0;
    animPaint(ANIM.t);
    updatePlayLabel();
    if (ANIM.t >= ANIM.dur && ANIM.mode === 'ok' && ANIM.id && !PROG.anim[ANIM.id]) {
      PROG.anim[ANIM.id] = 1;
      saveProg();
    }
    return;
  }
  animPaint(ANIM.t);
  ANIM.raf = requestAnimationFrame(animTick);
}

function badSideFor(r) {
  if (r.right.some(function (it) { return it.coef > 1; })) return 'right';
  if (r.left.some(function (it) { return it.coef > 1; })) return 'left';
  return 'right';
}

function buildAnimStage(r) {
  const sc = animScene(r, ANIM.mode, window.innerWidth < 820, { badSide: badSideFor(r) });
  ANIM.scene = sc;
  ANIM.bounds = animBounds(sc);
  ANIM.dur = ANIM.bounds[4];
  ANIM.stopAt = ANIM.dur;

  document.getElementById('anim-stage').innerHTML = animSvg(sc);
  const infoL = document.getElementById('anim-info-left');
  if (infoL) infoL.innerHTML = speciesInfoColumn(sc.leftItems);
  const infoR = document.getElementById('anim-info-right');
  if (infoR) infoR.innerHTML = speciesInfoColumn(sc.rightItems);
  const ledRows = document.getElementById('anim-ledger-rows');
  if (ledRows) ledRows.innerHTML = ledgerRowItemsHtml(sc.leftCounts, sc.rightCounts);
  sc.atoms.forEach(function (a, i) {
    a.g = document.querySelector('[data-a="' + i + '"]');
    a.ring = a.g.querySelector('.strand');
    a.glow = a.g.querySelector('.glow');
  });
  sc.bonds.forEach(function (b, i) {
    b.lines = Array.prototype.map.call(
      document.querySelectorAll('[data-b="' + i + '"]'),
      function (el) { return { el: el, off: Number(el.getAttribute('data-off')) }; }
    );
  });

  const labels = ANIM.mode === 'bad'
    ? ['拆开分子', '原子迁移', '重新组合', (ANIM.scene && ANIM.scene.badSide === 'left') ? '原子不够' : '原子多了']
    : ['拆开分子', '原子迁移', '重新组合', '原子守恒'];
  document.getElementById('anim-phases').innerHTML = labels.map(function (t, i) {
    return '<button type="button" class="phasechip' + (ANIM.mode === 'bad' && i === 3 ? ' warn' : '')
      + '" data-seek="' + i + '">' + t + '</button>';
  }).join('');

  const equal = tallyEqual(sc.leftCounts, sc.rightCounts);
  document.getElementById('anim-counts').innerHTML =
    '<span class="acount' + (equal ? '' : ' bad') + '">反应前 <b>' + animTallyText(sc.leftCounts, sc.elements) + '</b></span>'
    + '<span class="acount' + (equal ? '' : ' bad') + '">反应后 <b>' + animTallyText(sc.rightCounts, sc.elements) + '</b></span>';

  ANIM.phase = -1;
  ANIM.flashKey = '';
  animPaint(0);
  updatePlayLabel();
}

   ⑩ 化学键图鉴
   ============================================================ */
function metalArt() {
  let cells = '';
  for (let r = 0; r < 3; r++) {
    for (let c = 0; c < 3; c++) {
      cells += '<circle cx="' + (24 + c * 34) + '" cy="' + (20 + r * 26) + '" r="9.5"'
        + ' fill="#C46A2E" stroke="#9C4E1D" stroke-width="1.2"/>';
    }
  }
  const e = [[41, 33], [58, 46], [75, 20], [41, 59], [58, 12], [75, 60]];
  let dots = e.map(function (p) {
    return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="2.6" fill="var(--brand)"/>';
  }).join('');
  return '<svg viewBox="0 0 120 92" width="104" height="80" role="img" aria-label="金属键示意">'
    + cells + dots + '</svg>';
}

const LAB = { lesson: null, mode: null, t: 0, dur: 0, playing: false, raf: 0, last: 0, paint: null, loop: false };

function labHalt() {
  LAB.playing = false;
  if (LAB.raf) cancelAnimationFrame(LAB.raf);
  LAB.raf = 0;
}

function labLabel() {
  const b = document.querySelector('[data-lab-play]');
  if (!b) return;
  b.textContent = LAB.playing ? '暂停' : (LAB.loop || LAB.t < LAB.dur ? '播放' : '重播');
}

function labStart() {
  if (!LAB.paint) return;
  LAB.playing = true;
  LAB.last = performance.now();
  if (LAB.raf) cancelAnimationFrame(LAB.raf);
  LAB.raf = requestAnimationFrame(labTick);
  labLabel();
}

function labPause() {
  LAB.playing = false;
  if (LAB.raf) cancelAnimationFrame(LAB.raf);
  LAB.raf = 0;
  labLabel();
}

function labReplay() {
  LAB.t = 0;
  if (LAB.paint) LAB.paint(0);
  if (LAB.raf) cancelAnimationFrame(LAB.raf);
  LAB.raf = 0;
  labStart();
}

function labTick(now) {
  if (!LAB.playing) return;
  const dt = Math.min(64, now - LAB.last);
  LAB.last = now;
  LAB.t += dt;
  if (LAB.loop) {
    if (LAB.t >= LAB.dur) LAB.t = 0;
  } else if (LAB.t >= LAB.dur) {
    LAB.t = LAB.dur;
    LAB.playing = false;
    LAB.raf = 0;
  }
  if (LAB.paint) LAB.paint(LAB.t);
  labLabel();
  if (LAB.playing) LAB.raf = requestAnimationFrame(labTick);
}

/* ---------- 化学键先导课：键能与活化能 ---------- */
function biBondE(d) { return 160 * (Math.pow(1 - Math.exp(-4 * (d - 1)), 2) - 1); }
function biBondX(d) {
  return d <= 1 ? 50 + (d - 0.5) / 0.5 * 230 : 280 + (d - 1) / 2 * 240;
}
function biBondY(E) { return 280 - (E + 170) * 0.857; }
function biReactE(t, peak) {
  return (1 - t) * (1 - t) * (-20) + 2 * (1 - t) * t * peak + t * t * (-100);
}
function biReactY(E) { return 280 - (E + 110) * 0.818; }
function biReactX(t) { return 50 + t * 470; }
function biReactPeakT(peak) { return (peak + 20) / (2 * peak + 100); }

function bindBondIntro(stage) {
  let view = 'bond';
  let cat = false;
  const dist = stage.querySelector('[data-bi-dist]');
  const prog = stage.querySelector('[data-bi-prog]');
  const catBox = stage.querySelector('[data-bi-cat]');
  const bondView = stage.querySelector('[data-bi-bond-view]');
  const reactView = stage.querySelector('[data-bi-react-view]');
  const bondCtrl = stage.querySelector('[data-bi-bond-ctrl]');
  const reactCtrl = stage.querySelector('[data-bi-react-ctrl]');
  const catWrap = stage.querySelector('[data-bi-cat-wrap]');
  const bondDot = stage.querySelector('[data-bi-bond-dot]');
  const atomL = stage.querySelector('[data-bi-atom-l]');
  const atomR = stage.querySelector('[data-bi-atom-r]');
  const atomLt = stage.querySelector('[data-bi-atom-lt]');
  const atomRt = stage.querySelector('[data-bi-atom-rt]');
  const rn = stage.querySelector('[data-bi-rn]');
  const rc = stage.querySelector('[data-bi-rc]');
  const rdot = stage.querySelector('[data-bi-react-dot]');
  const barrier = stage.querySelector('[data-bi-barrier]');
  const barrierLabel = stage.querySelector('[data-bi-barrier-label]');
  const status = stage.querySelector('[data-bi-status]');
  const distVal = stage.querySelector('[data-bi-dist-val]');
  const progVal = stage.querySelector('[data-bi-prog-val]');
  const tabs = Array.prototype.slice.call(stage.querySelectorAll('[data-bi-view]'));

  function updateBond() {
    const d = Number(dist.value) / 100;
    const x = biBondX(d), y = biBondY(biBondE(d));
    bondDot.setAttribute('cx', x.toFixed(1));
    bondDot.setAttribute('cy', y.toFixed(1));
    const sep = 36 + (d - 0.5) / 2.5 * 230;
    const lx = 280 - sep / 2, rx = 280 + sep / 2;
    atomL.setAttribute('cx', lx.toFixed(1));
    atomR.setAttribute('cx', rx.toFixed(1));
    atomLt.setAttribute('x', lx.toFixed(1));
    atomRt.setAttribute('x', rx.toFixed(1));
    distVal.textContent = d.toFixed(2);
    let msg, cls = '';
    if (d > 2.3) {
      msg = '太远：两个原子几乎没有作用，能量接近 0。';
    } else if (d > 1.12) {
      msg = '靠近：能量下降，成键会放出能量。';
      cls = 'good';
    } else if (d >= 0.88) {
      msg = '键长附近：能量最低，最稳定；井深就是键能。';
      cls = 'good';
    } else {
      msg = '太近：原子核互相排斥，能量急剧升高。';
      cls = 'warn';
    }
    status.className = 'bi-status' + (cls ? ' ' + cls : '');
    status.textContent = msg;
  }

  function updateReact() {
    const t = Number(prog.value) / 100;
    const peak = cat ? 70 : 160;
    const tMax = biReactPeakT(peak);
    const x = biReactX(t), y = biReactY(biReactE(t, peak));
    rdot.setAttribute('cx', x.toFixed(1));
    rdot.setAttribute('cy', y.toFixed(1));
    if (cat) {
      rn.setAttribute('class', 'bi-curve dashed');
      rc.setAttribute('class', 'bi-curve');
    } else {
      rn.setAttribute('class', 'bi-curve');
      rc.setAttribute('class', 'bi-curve dashed bi-off');
    }
    const px = biReactX(tMax);
    const py = biReactY(biReactE(tMax, peak));
    barrier.setAttribute('x1', px.toFixed(1));
    barrier.setAttribute('x2', px.toFixed(1));
    barrier.setAttribute('y1', biReactY(-20).toFixed(1));
    barrier.setAttribute('y2', py.toFixed(1));
    barrierLabel.setAttribute('x', px.toFixed(1));
    barrierLabel.setAttribute('y', (py - 12).toFixed(1));
    progVal.textContent = Math.round(t * 100) + '%';
    let msg, cls = '';
    if (t < 0.08) msg = '反应物：旧键还没断，能量较低。';
    else if (Math.abs(t - tMax) < 0.06) msg = '过渡态：旧键快断、新键将成，这是最费劲的一步。';
    else if (t < tMax) msg = '爬坡：拉开旧键要吸收能量。';
    else if (t > 0.92) { msg = '产物：新键形成，能量降低，多余能量放出。'; cls = 'good'; }
    else msg = '下坡：形成新键，放出能量。';
    if (cat) msg = '催化剂把坡削低（活化能变小），但反应热不变。' + msg;
    status.className = 'bi-status' + (cls ? ' ' + cls : '');
    status.textContent = msg;
  }

  function update() {
    if (view === 'bond') updateBond();
    else updateReact();
  }

  tabs.forEach(function (b) {
    b.addEventListener('click', function () {
      view = b.dataset.biView;
      tabs.forEach(function (x) { x.classList.toggle('on', x === b); });
      bondView.classList.toggle('bi-off', view !== 'bond');
      reactView.classList.toggle('bi-off', view !== 'react');
      bondCtrl.classList.toggle('bi-off', view !== 'bond');
      reactCtrl.classList.toggle('bi-off', view !== 'react');
      catWrap.classList.toggle('bi-off', view !== 'react');
      update();
    });
  });
  dist.addEventListener('input', updateBond);
  prog.addEventListener('input', updateReact);
  catBox.addEventListener('change', function () { cat = catBox.checked; updateReact(); });
  update();
}

/* ---------- 共价键 ---------- */
const COV_MODES = {
  H2: { a: 'H', b: 'H', order: 1 },
  O2: { a: 'O', b: 'O', order: 2 },
  N2: { a: 'N', b: 'N', order: 3 },
  HCl: { a: 'H', b: 'Cl', order: 1, polar: true }
};

function covalentScene(mode) {
  const m = COV_MODES[mode] || COV_MODES.H2;
  const ra = Math.round(EL[m.a].r * 1.55);
  const rb = Math.round(EL[m.b].r * 1.55);
  const cy = 135;
  let bonds = '';
  for (let i = 0; i < m.order; i++) {
    const off = (i - (m.order - 1) / 2) * 8;
    bonds += '<line data-b x1="' + (200 + ra) + '" y1="' + (cy + off) + '" x2="' + (360 - rb) + '" y2="' + (cy + off)
      + '" stroke="var(--bond)" stroke-width="2.4" stroke-linecap="round"/>';
  }
  let dots = '';
  for (let i = 0; i < m.order; i++) {
    const dy = (i - (m.order - 1) / 2) * 15;
    const cx = 280 + (m.polar ? 12 : 0);
    dots += '<circle cx="' + (cx - 4) + '" cy="' + (cy + dy) + '" r="3.5" fill="var(--brand)"/>'
      + '<circle cx="' + (cx + 4) + '" cy="' + (cy + dy) + '" r="3.5" fill="var(--brand)"/>';
  }
  const formula = SPECIES[mode] ? SPECIES[mode].formula : 'HCl';
  return {
    dur: 3800,
    html: labSvg(
      '<g data-bondg opacity="0">' + bonds + '</g>'
      + '<g data-dotg opacity="0">' + dots + '</g>'
      + '<g data-a transform="translate(110,135)">' + labAtom(m.a, ra) + '</g>'
      + '<g data-b2 transform="translate(450,135)">' + labAtom(m.b, rb) + '</g>'
      + '<text x="280" y="232" text-anchor="middle" font-size="14" fill="var(--ink-2)">'
      + formula + ' · ' + m.order + ' 对共用电子</text>'
      + (m.polar ? '<text data-polar x="280" y="66" text-anchor="middle" font-size="13" fill="var(--bondc)" opacity="0">电子对偏向 Cl →</text>' : '')
    ),
    setup: function (root) {
      const a = root.querySelector('[data-a]');
      const b = root.querySelector('[data-b2]');
      const dg = root.querySelector('[data-dotg]');
      const bg = root.querySelector('[data-bondg]');
      const pl = root.querySelector('[data-polar]');
      return function (t) {
        const p = easeInOut(clamp01(t / 1100));
        a.setAttribute('transform', 'translate(' + (110 + 90 * p) + ',135)');
        b.setAttribute('transform', 'translate(' + (450 - 90 * p) + ',135)');
        dg.setAttribute('opacity', clamp01((t - 1200) / 600));
        bg.setAttribute('opacity', clamp01((t - 1900) / 800));
        if (pl) pl.setAttribute('opacity', clamp01((t - 2400) / 600));
      };
    }
  };
}

  }
  const epos = [[215, 115], [305, 115], [215, 185], [305, 185], [230, 55], [290, 245], [125, 150], [395, 150]];

    html: labSvg(

      + '<line data-slip x1="280" y1="55" x2="280" y2="245" stroke="var(--ink-2)" stroke-width="1" stroke-dasharray="4 6" opacity="0"/>'

      + '<text data-status x="280" y="266" text-anchor="middle" font-size="13" fill="var(--ink-2)">'
      + (on ? '通电：自由电子定向移动 → 导电' : stretch ? '拉伸：离子层错位，金属不断 → 延展' : '断电：电子自由乱动，没有统一方向')
      + '</text>'
    ),
    setup: function (root) {
      const rows = root.querySelectorAll('.metal-row');
      const els = root.querySelectorAll('.metal-el');
      const slip = root.querySelector('[data-slip]');
      const status = root.querySelector('[data-status]');
      return function (t) {
        Array.prototype.forEach.call(rows, function (g, r) {
          const off = stretch
            ? (r === 0 ? 14 : r === 2 ? -14 : 0) * clamp01((t - 500) / 1000)
            : 0;
          g.setAttribute('transform', 'translate(' + off.toFixed(1) + ',0)');
        });
        if (slip) slip.setAttribute('opacity', stretch ? '0.45' : '0');
        Array.prototype.forEach.call(els, function (el, i) {
          const b = epos[i];
          let x, y;
          if (on) {
            x = 140 + ((b[0] - 140 + t / 20 + i * 24) % 280);
            y = b[1] + Math.sin(t / 450 + i) * 2;
          } else {
            x = b[0] + Math.sin(t / 600 + i * 1.7) * 12;
            y = b[1] + Math.cos(t / 700 + i * 1.3) * 9;
          }
          el.setAttribute('cx', x.toFixed(1));
          el.setAttribute('cy', y.toFixed(1));
        });
        status.textContent = on ? '通电：自由电子定向移动 → 导电'
          : stretch ? '拉伸：离子层错位，金属不断 → 延展'
          : '断电：电子自由乱动，没有统一方向';
      };
    }
  };
}

    dur: 5400,
    html: labSvg(html + '<text x="20" y="24" text-anchor="start" font-size="11" fill="var(--ink-2)">键能单位：kJ/mol</text>'
      + '<text x="280" y="262" text-anchor="middle" font-size="13" fill="var(--ink-2)">同样用力拉：F₂ 先断，N₂ 最后断</text>'),
    setup: function (root) {
      const groups = root.querySelectorAll('[data-bo]');
      const refs = BO_DATA.map(function (d, i) {
        const g = groups[i];
        return {
          d: d,
          r: Math.round(EL[SPECIES[d.key].atoms[0].el].r * 1.35),
          a: g.querySelector('[data-a]'),
          b: g.querySelector('[data-b2]'),
          lines: g.querySelectorAll('[data-l]')
        };
      });
      return function (t) {
        refs.forEach(function (ref) {
          const d = ref.d;
          const p = clamp01((t - 600) / (d.brk - 600));
          const sep = 34 + 26 * p;
          ref.a.setAttribute('transform', 'translate(' + (d.cx - sep).toFixed(1) + ',120)');
          ref.b.setAttribute('transform', 'translate(' + (d.cx + sep).toFixed(1) + ',120)');
          const op = t > d.brk ? '0' : '1';
          Array.prototype.forEach.call(ref.lines, function (ln) {
            const off = Number(ln.getAttribute('data-off'));
            ln.setAttribute('opacity', op);
            ln.setAttribute('x1', (d.cx - sep + ref.r).toFixed(1));
            ln.setAttribute('x2', (d.cx + sep - ref.r).toFixed(1));
            ln.setAttribute('y1', (120 + off).toFixed(1));
            ln.setAttribute('y2', (120 + off).toFixed(1));
          });
        });
      };
    }
  };
}

function buildLab(l) {
  if (!l) return;
  const cfg = SCENES[l.scene] || WHY_SCENES[l.scene];
  const stage = document.getElementById('lesson-stage');
  const ctrls = document.getElementById('lesson-controls');
  if (!cfg || !stage) return;
  labHalt();

  if (!cfg.build) {
    stage.innerHTML = cfg.html();
    ctrls.innerHTML = '<span class="note">' + (cfg.note || '这一页是静态图示，配合下面的要点看。') + '</span>';
    LAB.paint = null;
    if (cfg.after) cfg.after(stage);
    return;
  }

  let mode = LAB.mode;
  if (cfg.modes) {
    const ok = cfg.modes.some(function (m) { return m[0] === mode; });
    if (!ok) mode = cfg.modes[0][0];
    LAB.mode = mode;
  }

  const built = cfg.build(mode);
  stage.innerHTML = built.html;
  LAB.dur = built.dur || 4000;
  LAB.loop = !!cfg.loop;
  LAB.t = 0;
  LAB.paint = built.setup(stage);
  LAB.paint(0);

  let h = '<button class="btn" data-lab-play="1">暂停</button>'
    + '<button class="btn" data-lab-replay="1">重播</button>';
  if (cfg.modes) {
    h += '<span class="note">切换：</span>' + cfg.modes.map(function (m) {
      return '<button class="modebtn' + (m[0] === mode ? ' on' : '') + '" data-lab-mode="' + m[0] + '">' + m[1] + '</button>';
    }).join('');
  }
  ctrls.innerHTML = h;
  labStart();
}

  const hEl = document.querySelector('[data-ratio="h"]');
  const oEl = document.querySelector('[data-ratio="o"]');
  if (!hEl || !oEl) return;
  const h = Number(hEl.value);
  const o = Number(oEl.value);
  const made = Math.min(Math.floor(h / 2), o);
  const water = 2 * made;
  const leftH = h - 2 * made;
  const leftO = o - made;

  document.getElementById('rh').textContent = h;
  document.getElementById('ro').textContent = o;
  document.getElementById('ratioStats').innerHTML =
    '<span class="ratio-stat">H₂ <b>' + h + '</b> 个</span>'
    + '<span class="ratio-stat">O₂ <b>' + o + '</b> 个</span>'
    + '<span class="ratio-stat">生成 H₂O <b>' + water + '</b> 个</span>'
    + (leftH ? '<span class="ratio-stat warn">剩 H₂ <b>' + leftH + '</b> 个</span>' : '')
    + (leftO ? '<span class="ratio-stat warn">剩 O₂ <b>' + leftO + '</b> 个</span>' : '');

  const status = document.getElementById('ratioStatus');
  if (made === 0) {
    status.textContent = '还不够生成 1 个 H₂O：至少需要 2 个 H₂ 和 1 个 O₂';
    status.className = 'ratio-status';
  } else if (!leftH && !leftO) {
    status.textContent = '刚好 2:1，全部用完 ✓';
    status.className = 'ratio-status good';
  } else if (leftH && leftO) {
    status.textContent = '两种都剩：H₂ ' + leftH + ' 个、O₂ ' + leftO + ' 个，比例不对';
    status.className = 'ratio-status';
  } else if (leftH) {
    status.textContent = 'H₂ 过量，剩下 ' + leftH + ' 个 H₂';
    status.className = 'ratio-status';
  } else {
    status.textContent = 'O₂ 过量，剩下 ' + leftO + ' 个 O₂';
    status.className = 'ratio-status';
  }
}

/* ---------- 溶解度曲线 ---------- */
const SOL_DATA = {
  'NaCl': [[0, 35.7], [20, 36.0], [40, 36.6], [60, 37.3], [80, 38.4], [100, 39.8]],
  'KNO₃': [[0, 13.3], [20, 31.6], [40, 63.9], [60, 110], [80, 169], [100, 246]],
  'Ca(OH)₂': [[0, 0.185], [20, 0.165], [40, 0.121], [60, 0.086], [80, 0.058], [100, 0.047]]
};

function solAt(key, T) {
  const pts = SOL_DATA[key];
  for (let i = 0; i < pts.length - 1; i++) {
    if (T <= pts[i + 1][0]) {
      const t0 = pts[i][0], t1 = pts[i + 1][0];
      const s0 = pts[i][1], s1 = pts[i + 1][1];
      return s0 + (s1 - s0) * (T - t0) / (t1 - t0);
    }
  }
  return pts[pts.length - 1][1];
}

  const colors = { 'NaCl': '#0E7490', 'KNO₃': 'var(--brand)', 'Ca(OH)₂': '#B45309' };

    const pts = SOL_DATA[k].map(function (p) {

    }).join(' ');
    curves += '<polyline points="' + pts + '" fill="none" stroke="' + colors[k] + '" stroke-width="2"/>';
