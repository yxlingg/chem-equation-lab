  let ticks = '';

  });
  let dots = '';

  });
  return '<div class="g9-tool"><h4>溶解度曲线（拖动温度）</h4>'
    + '<svg viewBox="0 0 560 280" role="img" aria-label="溶解度曲线">'
    + '<line x1="60" y1="240" x2="530" y2="240" stroke="var(--line)" stroke-width="1.5"/>'
    + '<line x1="60" y1="30" x2="60" y2="240" stroke="var(--line)" stroke-width="1.5"/>'
    + '<text x="60" y="20" text-anchor="start" font-size="11" fill="var(--ink-2)">溶解度/g</text>'
    + ticks + curves
    + '<line data-sol-line x1="154" y1="30" x2="154" y2="240" stroke="var(--brand)" stroke-width="1.5" stroke-dasharray="4 4"/>'
    + dots
    + '<text x="525" y="44" text-anchor="end" font-size="11" fill="' + colors['KNO₃'] + '">KNO₃</text>'
    + '<text x="525" y="204" text-anchor="end" font-size="11" fill="' + colors['NaCl'] + '">NaCl</text>'
    + '<text x="525" y="236" text-anchor="end" font-size="10" fill="' + colors['Ca(OH)₂'] + '">Ca(OH)₂（很小）</text>'
    + '<text x="512" y="272" text-anchor="end" font-size="11" fill="var(--ink-2)">温度/℃</text>'
    + '</svg>'

    + '<b id="solT">20℃</b></div>'
    + '<div class="tool-readout" id="solReadout"></div></div>';
}

function updateSol() {
  const input = document.querySelector('[data-sol-t]');
  if (!input) return;
  const T = Number(input.value);
  const line = document.querySelector('[data-sol-line]');
  const x = 60 + T * 4.7;
  line.setAttribute('x1', x.toFixed(1));
  line.setAttribute('x2', x.toFixed(1));
  document.getElementById('solT').textContent = T + '℃';
  const parts = [];
  Object.keys(SOL_DATA).forEach(function (k) {
    const s = solAt(k, T);
    const dot = document.querySelector('[data-sol-dot="' + k + '"]');
    dot.setAttribute('cx', x.toFixed(1));
    dot.setAttribute('cy', (240 - s * 0.78).toFixed(1));
    const val = k === 'Ca(OH)₂' ? s.toFixed(3) : s.toFixed(1);
    const w = (s / (100 + s) * 100).toFixed(k === 'Ca(OH)₂' ? 2 : 1);
    parts.push(k + ' <b>' + val + 'g</b>（质量分数 ' + w + '%）');
  });
  document.getElementById('solReadout').innerHTML =
    T + '℃：' + parts.join(' · ')
    + '<br>提纯建议：KNO₃ 陡升 → 降温结晶；NaCl 平缓 → 蒸发结晶。'
    + '<br>Ca(OH)₂ 随温度升高溶解度减小，曲线向下。'
    + '<br><span style="font-size:12px">曲线为示意图，不用于精确计算。</span>';
}

/* ---------- pH 曲线 ---------- */
function phAt(v) {
  if (v < 20) {
    const c = (20 - v) / (20 + v) * 0.1;
    return -Math.log10(Math.max(c, 1e-7));
  }
  if (v === 20) return 7;
  const c = (v - 20) / (20 + v) * 0.1;
  return 14 + Math.log10(Math.max(c, 1e-7));
}

  return '<div class="g9-tool"><h4>pH 曲线：向 20 mL 稀盐酸中加 NaOH</h4>'
    + '<svg viewBox="0 0 560 280" role="img" aria-label="pH 曲线">'

function updatePH() {
  const input = document.querySelector('[data-ph-v]');

  let state;
  if (v < 20) state = '酸性，盐酸过量';
  else if (v === 20) state = '恰好中和';
  else state = '碱性，NaOH 过量';

  const lit = pH < 5 ? ['red', '红'] : pH <= 8 ? ['purple', '紫'] : ['blue', '蓝'];
  const phe = pH < 8.2 ? ['gray', '无色'] : ['pink', '粉红'];
  document.getElementById('phReadout').innerHTML =
    '加入 <b>' + v + ' mL</b>：pH≈<b>' + pH.toFixed(1) + '</b>，' + state
    + '<br>石蕊<span class="indicator ' + lit[0] + '">' + lit[1] + '</span>'
    + '酚酞<span class="indicator ' + phe[0] + '">' + phe[1] + '</span>';
}

    optsB += '<option' + (ion === 'OH⁻' ? ' selected' : '') + '>' + ion + '</option>';
  });
  return '<div class="g9-tool"><h4>离子共存检查</h4>'
    + '<div class="ion-row"><select data-ion-a>' + optsA + '</select>'
    + '<span>+</span><select data-ion-b>' + optsB + '</select></div>'
    + '<div class="ion-result" id="ionResult"></div>'
    + '<p class="tool-readout">只覆盖初中常见的沉淀、气体、水；NH₄⁺ 与 OH⁻ 需要加热。颜色（Cu²⁺ 蓝、Fe³⁺ 黄）不在本表判断。</p></div>';
}

function updateIon() {
  const a = document.querySelector('[data-ion-a]');
  const b = document.querySelector('[data-ion-b]');
  if (!a || !b) return;
  const x = a.value, y = b.value;
  const el = document.getElementById('ionResult');
  if (x === y) {
    el.innerHTML = '<b>' + x + '</b> 与 <b>' + y + '</b>：同种离子，当然能共存。';
    return;
  }
  let hit = null;
  for (let i = 0; i < ION_RULES.length; i++) {
    const r = ION_RULES[i];
    if ((r[0] === x && r[1] === y) || (r[0] === y && r[1] === x)) { hit = r; break; }
  }
  if (hit) {
    el.innerHTML = '<b>' + x + '</b> 与 <b>' + y + '</b>：<b style="color:var(--danger)">不能大量共存</b>。'
      + '<br>' + hit[2];
  } else {
    el.innerHTML = '<b>' + x + '</b> 与 <b>' + y + '</b>：<b style="color:var(--ok)">能大量共存</b>（按初中常见范围）。';
  }
}

/* ---------- 除杂顺序实验台 ---------- */
const PURIFY_REAGENTS = [
  { id: 'BaCl2', label: 'BaCl₂', note: '除 SO₄²⁻' },
  { id: 'NaOH', label: 'NaOH', note: '除 Mg²⁺' },
  { id: 'Na2CO3', label: 'Na₂CO₃', note: '除 Ca²⁺、Ba²⁺' },
  { id: 'HCl', label: 'HCl', note: '除过量 OH⁻、CO₃²⁻' }
];

function purifySim(seq) {
  const st = { Mg: true, Ca: true, SO4: true, Ba: false, OH: false, CO3: false };
  const steps = [];
  seq.forEach(function (id) {
    const r = PURIFY_REAGENTS.filter(function (x) { return x.id === id; })[0];
    const lines = [];
    if (id === 'BaCl2') {
      if (st.SO4) { st.SO4 = false; lines.push('除去 SO₄²⁻：Ba²⁺ + SO₄²⁻ → BaSO₄↓'); }
      else lines.push('溶液里已经没有 SO₄²⁻，Ba²⁺ 全部过量');
      st.Ba = true;
      lines.push('引入过量 Ba²⁺，要靠后面的 Na₂CO₃ 除去');
    } else if (id === 'NaOH') {
      if (st.Mg) { st.Mg = false; lines.push('除去 Mg²⁺：Mg²⁺ + 2OH⁻ → Mg(OH)₂↓'); }
      else lines.push('已经没有 Mg²⁺，OH⁻ 全部过量');
      st.OH = true;
      lines.push('引入过量 OH⁻，要靠最后的盐酸中和');
    } else if (id === 'Na2CO3') {
      const hit = [];
      if (st.Ca) { st.Ca = false; hit.push('Ca²⁺'); }
      if (st.Ba) { st.Ba = false; hit.push('Ba²⁺'); }
      if (hit.length) lines.push('除去 ' + hit.join('、') + '：生成碳酸盐沉淀');
      else lines.push('没有 Ca²⁺、Ba²⁺ 可除，Na₂CO₃ 全部过量');
      st.CO3 = true;
      lines.push('引入过量 CO₃²⁻，要靠最后的盐酸除去');
    } else if (id === 'HCl') {
      const hit = [];
      if (st.OH) { st.OH = false; hit.push('OH⁻'); }
      if (st.CO3) { st.CO3 = false; hit.push('CO₃²⁻'); }
      if (hit.length) lines.push('中和 ' + hit.join('、') + '：H⁺ + OH⁻ → H₂O；2H⁺ + CO₃²⁻ → H₂O + CO₂↑');
      else lines.push('没有 OH⁻、CO₃²⁻ 可中和，这一步白加');
      lines.push('引入 Cl⁻（无害），多余的盐酸最后蒸发除去');
    }
    steps.push({ id: id, label: r.label, lines: lines, st: Object.assign({}, st) });
  });

  const left = [];
  if (st.Mg) left.push('Mg²⁺');
  if (st.Ca) left.push('Ca²⁺');
  if (st.SO4) left.push('SO₄²⁻');
  if (st.Ba) left.push('Ba²⁺（过量）');
  if (st.OH) left.push('OH⁻（过量）');
  if (st.CO3) left.push('CO₃²⁻（过量）');
  return { steps: steps, left: left, ok: left.length === 0 };
}

function purifyCheck() {
  const seq = G9STATE.purifySeq;
  const sim = purifySim(seq);
  const at = function (id) { return seq.indexOf(id); };
  const reasons = [];
  if (seq.length < PURIFY_REAGENTS.length) {
    reasons.push('四种试剂都要用上，现在只加了 ' + seq.length + ' 种。');
  }
  if (at('HCl') >= 0 && at('HCl') !== seq.length - 1) {
    reasons.push('盐酸必须最后加：它先加，后面 NaOH、Na₂CO₃ 引入的 OH⁻、CO₃²⁻ 就没人除了。');
  }
  if (at('BaCl2') >= 0 && at('Na2CO3') >= 0 && at('Na2CO3') < at('BaCl2')) {
    reasons.push('Na₂CO₃ 必须在 BaCl₂ 之后：否则 BaCl₂ 引入的过量 Ba²⁺ 除不掉。');
  }
  if (!reasons.length && !sim.ok) {
    reasons.push('溶液里还剩下：' + sim.left.join('、') + '。');
  }
  G9STATE.purifyResult = {
    ok: sim.ok && reasons.length === 0,
    steps: sim.steps,
    left: sim.left,
    reasons: reasons
  };
}

function purifyToolHtml() {
  const seq = G9STATE.purifySeq;
  const res = G9STATE.purifyResult;

  let chips = '';
  if (!seq.length) {
    chips = '<span class="pf-empty">还没选试剂。按你认为正确的顺序点下面的按钮。</span>';
  } else {
    chips = seq.map(function (id) {
      const r = PURIFY_REAGENTS.filter(function (x) { return x.id === id; })[0];
      return '<span class="pf-chip">' + r.label + '</span>';
    }).join('<span class="pf-arrow">→</span>');
  }

  const btns = PURIFY_REAGENTS.map(function (r) {
    const used = seq.indexOf(r.id) >= 0;
    return '<button class="pf-reagent' + (used ? ' used' : '') + '" data-purify="' + r.id + '"'
      + (used ? ' disabled' : '') + '>' + r.label + '</button>';
  }).join('');

  let out = '';
  if (res) {
    const steps = res.steps.map(function (s, i) {
      return '<div class="pf-step"><span class="pf-num">' + (i + 1) + '</span>'
        + '<div><b>' + s.label + '</b><br>' + s.lines.join('<br>') + '</div></div>';
    }).join('');
    const verdict = res.ok
      ? '<div class="pf-verdict ok"><b>顺序正确。</b>四种杂质都除掉了，过量的 Ba²⁺、OH⁻、CO₃²⁻ 也处理干净，最后蒸干只剩 NaCl。</div>'
      : '<div class="pf-verdict bad"><b>这个顺序不行。</b>' + res.reasons.join('<br>') + '</div>';
    out = '<div class="pf-steps">' + steps + '</div>' + verdict
      + '<p class="pf-ions">最终溶液里还需要除掉的离子：' + (res.left.length ? res.left.join('、') : '无') + '</p>';
  }

  const answer = G9STATE.purifyAnswer
    ? '<div class="pf-answer"><b>正确顺序不止一种。</b>只要满足两条：<br>'
      + '① BaCl₂ 在 Na₂CO₃ 之前（保证过量的 Ba²⁺ 能被除掉）；<br>'
      + '② 盐酸在最后（中和掉过量的 OH⁻ 和 CO₃²⁻）。<br>'
      + 'NaOH 放在 BaCl₂ 前面或后面都可以，例如 BaCl₂ → NaOH → Na₂CO₃ → HCl。</div>'
    : '';

  return '<div class="g9-tool" id="purifyBox"><h4>除杂顺序实验台（粗盐提纯）</h4>'
    + '<p class="elab-hint">粗盐溶液里有 MgCl₂、CaCl₂、Na₂SO₄。点试剂排出加药顺序，再点检查。</p>'
    + '<div class="pf-seq">' + chips + '</div>'
    + '<div class="pf-reagents">' + btns + '</div>'
    + '<div class="ai-row"><button class="btn primary" data-purify-check>检查</button>'
    + '<button class="btn" data-purify-reset>重来</button>'
    + '<button class="btn" data-purify-answer>看正确顺序</button></div>'
    + out + answer + '</div>';
}

/* ---------- 推断筛子 ---------- */
const INFER_POOL = [
  { id: 'caco3', name: 'CaCO₃', note: '难溶白色固体' },
  { id: 'na2co3', name: 'Na₂CO₃', note: '可溶，溶液碱性' },
  { id: 'naoh', name: 'NaOH', note: '可溶，溶液碱性' },
  { id: 'caoh2', name: 'Ca(OH)₂', note: '微溶，溶液碱性' },
  { id: 'co2', name: 'CO₂', note: '无色气体' },
  { id: 'cuso4', name: 'CuSO₄', note: '溶液蓝色' }
];
const INFER_CLUES = [
  { id: 'white', label: '难溶的白色固体', keep: ['caco3'] },
  { id: 'blue', label: '溶液呈蓝色', keep: ['cuso4'] },
  { id: 'gas', label: '使澄清石灰水变浑浊的气体', keep: ['co2'] },
  { id: 'phen', label: '溶液使酚酞变红', keep: ['na2co3', 'naoh', 'caoh2'] },
  { id: 'hcl', label: '与稀盐酸反应放出气体', keep: ['caco3', 'na2co3'] },
  { id: 'heat', label: '高温分解生成两种氧化物', keep: ['caco3'] }
];

function inferCandidates() {
  let set = INFER_POOL.map(function (p) { return p.id; });
  G9STATE.inferPicked.forEach(function (id) {
    const clue = INFER_CLUES.filter(function (c) { return c.id === id; })[0];
    if (clue) set = set.filter(function (x) { return clue.keep.indexOf(x) >= 0; });
  });
  return set;
}

function inferToolHtml() {
  const picked = G9STATE.inferPicked;
  const cands = inferCandidates();
  const chips = INFER_POOL.map(function (p) {
    const out = picked.length > 0 && cands.indexOf(p.id) < 0;
    const hit = cands.length === 1 && cands[0] === p.id;
    return '<div class="infer-chip' + (out ? ' out' : '') + (hit ? ' hit' : '') + '">'
      + '<b>' + p.name + '</b><span>' + p.note + '</span></div>';
  }).join('');
  const clues = INFER_CLUES.map(function (c) {
    return '<button type="button" class="infer-clue' + (picked.indexOf(c.id) >= 0 ? ' on' : '')
      + '" data-infer-clue="' + c.id + '">' + c.label + '</button>';
  }).join('');
  let msg, cls = 'infer-status';
  if (!picked.length) {
    msg = '先点一条线索，看它能排除谁。推断不是背框图，是不断缩小候选集。';
  } else if (!cands.length) {
    msg = '这几条线索互相矛盾，检查是不是把现象记混了。';
    cls += ' warn';
  } else if (cands.length === 1) {
    const one = INFER_POOL.filter(function (p) { return p.id === cands[0]; })[0];
    msg = '锁定 <b>' + one.name + '</b>。这条线索能唯一确定物质，就是突破口。';
    cls += ' good';
  } else {
    msg = '还剩 <b>' + cands.length + '</b> 个候选；线索还不够，再点一条。';
  }
  return '<div class="g9-tool" id="inferBox"><h4>突破口筛子：点线索，排除候选</h4>'
    + '<div class="infer-pool">' + chips + '</div>'
    + '<div class="infer-clues">' + clues + '</div>'
    + '<p class="' + cls + '">' + msg + '</p>'
    + '<div class="tool-btns" style="margin-top:10px"><button class="btn" data-infer-reset>重来</button></div></div>';
}

/* ---------- 变质侦探 ---------- */
function inqReset(scenario) {
  G9STATE.inq = {
    stage: 0, bacl2: false, hcl: false, lime: false, phen: false,
    filtered: false, done: false,
    scenario: scenario || 'partial',

  };
}

function inqBeakerSvg() {

  const precip = st.bacl2 || st.lime;
  const red = st.phen && !(st.bacl2 && st.scenario === 'complete');

      inner += '<circle class="precip" cx="' + x + '" cy="' + y + '" r="' + (3 + (i % 3)) + '" fill="#fff" opacity="0.9" style="animation-delay:' + (i * 0.12).toFixed(2) + 's"/>';

function inquiryToolHtml() {

  } else if (st.stage === 1) {

function inquiryPick(id) {
  const st = G9STATE.inq;
  if (st.stage !== 0) return;
  st.hcl = false; st.lime = false; st.phen = false;
  if (id === 'bacl2') {
    st.bacl2 = true;
    st.stage = 1;
    st.msg = '有白色沉淀，说明有 Na₂CO₃。';
    st.msgType = 'good';
  } else if (id === 'hcl') {
    st.hcl = true;
    st.msg = '有气泡，确实有 Na₂CO₃。但盐酸会把 NaOH 中和掉，接下来无法判断 NaOH 原来在不在。换一种试剂。';
    st.msgType = 'warn';
  } else if (id === 'lime') {
    st.lime = true;
    st.msg = '有白色沉淀，说明有 Na₂CO₃。但石灰水带来 OH⁻，后面加酚酞一定变红，无法证明原溶液的 NaOH。换一种试剂。';
    st.msgType = 'warn';
  } else if (id === 'phen') {
    st.phen = true;
    st.msg = '变红只说明溶液显碱性；Na₂CO₃ 也显碱性，不能证明 NaOH 还在。先除尽 CO₃²⁻。';
    st.msgType = 'warn';
  }
}

function inquiryNext(action) {
  const st = G9STATE.inq;
  if (st.stage !== 1) return;
  if (action === 'filter-phen') {
    st.filtered = true;
    st.phen = true;
    st.done = true;
    st.stage = 2;
    st.msg = ''; st.msgType = '';
  } else if (action === 'precip-phen') {
    st.msg = '酚酞检验的是溶液里的 OH⁻；滤渣是 BaCO₃，加酚酞没有意义。';
    st.msgType = 'warn';
  } else if (action === 'hcl') {
    st.msg = '盐酸会中和 NaOH，也会与 BaCO₃ 反应，无法判断 NaOH 原来是否存在。';
    st.msgType = 'warn';
  }
}

function inquiryScenario() {
  const next = G9STATE.inq.scenario === 'partial' ? 'complete' : 'partial';
  inqReset(next);
  G9STATE.inq.msg = '换了一瓶，按同样的顺序再验一次。';
  G9STATE.inq.msgType = '';
}

    + '</div>'
    + '<div class="calc-bars">'
    + '<div class="calc-bar-row" id="calcRowZn"><span class="calc-bar-lab">Zn 最多产 H₂</span>'

    + '<div class="calc-bar-row" id="calcRowAcid"><span class="calc-bar-lab">酸 最多产 H₂</span>'
    + '<span class="calc-bar"><i id="calcBarAcid"></i></span><span class="calc-bar-val" id="calcValAcid">—</span></div>'
    + '</div>'
    + '<p class="calc-status" id="calcStatus"></p></div>';

function updateCalc() {
  const znEl = document.querySelector('[data-calc-zn]');
  const acEl = document.querySelector('[data-calc-acid]');
  if (!znEl || !acEl) return;
  const zn = Number(znEl.value);
  const ac = Number(acEl.value);
  G9STATE.calcZn = zn;
  G9STATE.calcAcid = ac;
  const hZn = zn * 2 / 65;
  const hAc = ac * 2 / 98;
  const scale = Math.max(hZn, hAc) || 1;
  const equal = Math.abs(hZn - hAc) < 0.005;
  const znLim = !equal && hZn < hAc;

  document.getElementById('calcZnV').textContent = zn.toFixed(1) + ' g';
  document.getElementById('calcAcidV').textContent = ac.toFixed(1) + ' g';
  document.getElementById('calcBarZn').style.width = (hZn / scale * 100).toFixed(1) + '%';
  document.getElementById('calcBarAcid').style.width = (hAc / scale * 100).toFixed(1) + '%';
  document.getElementById('calcValZn').textContent = hZn.toFixed(2) + ' g';
  document.getElementById('calcValAcid').textContent = hAc.toFixed(2) + ' g';
  document.getElementById('calcRowZn').classList.toggle('lim', znLim);
  document.getElementById('calcRowAcid').classList.toggle('lim', !equal && !znLim);

  const status = document.getElementById('calcStatus');
  if (equal) {
    status.className = 'calc-status good';
    status.innerHTML = '恰好完全反应：Zn 和 H₂SO₄ 都刚好用完，生成 H₂ <b>' + hZn.toFixed(2) + ' g</b>。';
  } else if (znLim) {
    const left = ac - zn * 98 / 65;
    status.className = 'calc-status';
    status.innerHTML = 'Zn 先耗尽，是<b>限量试剂</b>；H₂SO₄ 还剩 <b>' + left.toFixed(2) + ' g</b>。'

  } else {
    const left = zn - ac * 65 / 98;
    status.className = 'calc-status';
    status.innerHTML = 'H₂SO₄ 先耗尽，是<b>限量试剂</b>；Zn 还剩 <b>' + left.toFixed(2) + ' g</b>。'

  }
}

function emptyProg() {
  return { detail: {}, anim: {}, bond: {}, g9: {}, g9a: {}, g9grade: 'down', bal: {}, predict: { correct: 0, answered: 0 }, ai: {}, wrong: {} };
}
let PROG = (function () {
  try {
    const raw = localStorage.getItem(PROG_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      if (p && typeof p === 'object') {
        const base = emptyProg();
        Object.keys(base).forEach(function (k) {
          if (p[k] === undefined || p[k] === null) p[k] = base[k];
        });
        if (!p.predict) p.predict = { correct: 0, answered: 0 };
        if (!p.wrong || typeof p.wrong !== 'object') p.wrong = {};
        if (!p.g9a || typeof p.g9a !== 'object') p.g9a = {};
        if (p.g9grade !== 'up') p.g9grade = 'down';
        return p;
      }
    }
  } catch (e) {}
  return emptyProg();
})();

function saveProg() {
  try { localStorage.setItem(PROG_KEY, JSON.stringify(PROG)); } catch (e) {}
}

function trackRoute(h) {
  if (h.indexOf('#/r/') === 0) PROG.detail[h.slice(4)] = 1;
  else if (h === '#/bond') PROG.bond.overview = 1;
  else if (h.indexOf('#/bond/') === 0) PROG.bond[h.slice(7)] = 1;
  else if (h === '#/g9') {
    if (PROG.g9grade === 'up') PROG.g9a['u-overview'] = 1;

  }
  else if (h.indexOf('#/g9/') === 0) {

      PROG.g9grade = 'up';

  }

  saveProg();
}

const PRACSTATE = { elabA: null, elabB: null, elabPlayed: false, predIndex: 0, predPicked: -1, predRight: 0 };

function elabFind(a, b) {
  for (let i = 0; i < ELAB_CASES.length; i++) {
    const c = ELAB_CASES[i];
    if ((c.a === a && c.b === b) || (c.a === b && c.b === a)) return c;
  }
  return null;
}

function shellR(i) { return 16 + (i + 1) * 13; }

function outerPoints(el, cx, cy) {
  const a = ELAB_ATOMS[el];
  const r = shellR(a.shells.length - 1);
  const n = a.shells[a.shells.length - 1];
  const pts = [];
  for (let k = 0; k < n; k++) {
    const ang = -Math.PI / 2 + k * (2 * Math.PI / n);
    pts.push({ x: cx + r * Math.cos(ang), y: cy + r * Math.sin(ang) });
  }
  return pts;
}

function elabAtomSvg(el, cx, cy, skipPts) {
  const a = ELAB_ATOMS[el];
  const L = a.shells.length;
  let out = '';
  for (let i = 0; i < L; i++) {
    const r = shellR(i);
    out += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="var(--line)" stroke-width="1.2"/>';
    const n = a.shells[i];
    const isOuter = i === L - 1;
    for (let k = 0; k < n; k++) {
      const ang = -Math.PI / 2 + k * (2 * Math.PI / n);
      const ex = cx + r * Math.cos(ang);
      const ey = cy + r * Math.sin(ang);
      if (skipPts && skipPts.length && isOuter) {
        let hit = false;
        for (let s = 0; s < skipPts.length; s++) {
          if (Math.abs(ex - skipPts[s].x) < 0.6 && Math.abs(ey - skipPts[s].y) < 0.6) { hit = true; break; }
        }
        if (hit) continue;
      }
      out += '<circle cx="' + ex.toFixed(1) + '" cy="' + ey.toFixed(1) + '" r="' + (isOuter ? 3.6 : 2.5) + '" fill="'
        + (isOuter ? 'var(--brand)' : 'var(--bond)') + '"/>';
    }
  }
  out += '<circle cx="' + cx + '" cy="' + cy + '" r="14" fill="' + a.fill + '" stroke="' + a.stroke + '" stroke-width="1.2"/>';
  out += '<text x="' + cx + '" y="' + (cy + 4.5) + '" text-anchor="middle" font-size="12.5" font-weight="700" fill="' + a.ink + '">' + el + '</text>';
  out += '<text x="' + cx + '" y="' + (cy + shellR(L - 1) + 20) + '" text-anchor="middle" font-size="11.5" fill="var(--ink-2)">'
    + el + ' · ' + a.name + '</text>';
  return out;
}

function elabFigure(c) {
  const cx2 = [170, 450];
  const cx3 = [120, 310, 500];
  const cy = 118;
  let els, xs;
  if (c.layout === 3) {
    const other = c.center === c.a ? c.b : c.a;
    els = [other, c.center, other];
    xs = cx3;
  } else {
    els = [c.a, c.b];
    xs = cx2;
  }

  const bonds = [];
  if (c.layout === 3) { bonds.push([0, 1]); bonds.push([1, 2]); }
  else bonds.push([0, 1]);

  let movers = '';
  const skip = [];

  if (c.kind === 'ionic') {
    const metalIdx = ELAB_ATOMS[els[0]].type === 'metal' ? 0 : 1;
    const nmIdx = 1 - metalIdx;
    const mPts = outerPoints(els[metalIdx], xs[metalIdx], cy);
    const nPts = outerPoints(els[nmIdx], xs[nmIdx], cy);
    const order2 = mPts.slice().sort(function (p, q) { return q.x - p.x; });
    const target = nPts.slice().sort(function (p, q) { return p.x - q.x; })[0];
    const count = Math.min(2, c.transfer);
    for (let i = 0; i < count; i++) {
      const p = order2[i];
      skip.push({ idx: metalIdx, x: p.x, y: p.y });
      const tx = target.x + (i === 0 ? 0 : 6);
      const ty = target.y + (i === 0 ? 0 : 8);
      movers += '<circle data-mover data-x0="' + p.x.toFixed(1) + '" data-y0="' + p.y.toFixed(1)
        + '" data-x1="' + tx.toFixed(1) + '" data-y1="' + ty.toFixed(1)
        + '" cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="4.4" fill="var(--brand)"/>';
    }
  } else {
    let mid = [];
    for (let i = 0; i < bonds.length; i++) {
      const l = bonds[i][0], r = bonds[i][1];
      const mx = (xs[l] + xs[r]) / 2;
      const lp = outerPoints(els[l], xs[l], cy).sort(function (p, q) {
        return Math.abs(p.x - mx) - Math.abs(q.x - mx);
      })[0];
      const rp = outerPoints(els[r], xs[r], cy).sort(function (p, q) {
        return Math.abs(p.x - mx) - Math.abs(q.x - mx);
      })[0];
      skip.push({ idx: l, x: lp.x, y: lp.y });
      skip.push({ idx: r, x: rp.x, y: rp.y });
      const ty0 = cy - 5, ty1 = cy + 5;
      movers += '<circle data-mover data-x0="' + lp.x.toFixed(1) + '" data-y0="' + lp.y.toFixed(1)
        + '" data-x1="' + (mx - 3).toFixed(1) + '" data-y1="' + ty0 + '" cx="' + lp.x.toFixed(1) + '" cy="' + lp.y.toFixed(1) + '" r="4" fill="var(--brand)"/>';
      movers += '<circle data-mover data-x0="' + rp.x.toFixed(1) + '" data-y0="' + rp.y.toFixed(1)
        + '" data-x1="' + (mx + 3).toFixed(1) + '" data-y1="' + ty1 + '" cx="' + rp.x.toFixed(1) + '" cy="' + rp.y.toFixed(1) + '" r="4" fill="var(--brand)"/>';
      mid.push({ mx: mx, y0: ty0, y1: ty1, l: l, r: r });
    }
    for (let i = 0; i < mid.length; i++) {
      for (let k = 0; k < c.order; k++) {
        const dy = c.order === 1 ? 0 : (k - (c.order - 1) / 2) * 6;
        const x1 = xs[mid[i].l] + shellR(ELAB_ATOMS[els[mid[i].l]].shells.length - 1) - 4;
        const x2 = xs[mid[i].r] - shellR(ELAB_ATOMS[els[mid[i].r]].shells.length - 1) + 4;
        movers += '<line data-bond x1="' + x1.toFixed(1) + '" y1="' + (cy + dy).toFixed(1)
          + '" x2="' + x2.toFixed(1) + '" y2="' + (cy + dy).toFixed(1) + '" stroke="var(--brand)" stroke-width="2.4" stroke-linecap="round"/>';
      }
    }
  }

  let atoms = '';
  for (let i = 0; i < els.length; i++) {
    const s = skip.filter(function (p) { return p.idx === i; });
    atoms += elabAtomSvg(els[i], xs[i], cy, s);
  }

  let charge = '';
  if (c.kind === 'ionic') {
    const mIdx = ELAB_ATOMS[els[0]].type === 'metal' ? 0 : 1;
    const nmIdx = 1 - mIdx;
    const mLabel = c.ionLabels ? c.ionLabels[0] : els[mIdx] + '+';
    const nLabel = c.ionLabels ? c.ionLabels[1] : els[nmIdx] + '−';
    charge = '<text data-charge x="' + xs[mIdx] + '" y="' + (cy - shellR(ELAB_ATOMS[els[mIdx]].shells.length - 1) - 10)
      + '" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ok)">'
      + mLabel + '</text>'
      + '<text data-charge x="' + xs[nmIdx] + '" y="' + (cy - shellR(ELAB_ATOMS[els[nmIdx]].shells.length - 1) - 10)
      + '" text-anchor="middle" font-size="14" font-weight="700" fill="var(--danger)">'
      + nLabel + '</text>'
      + '<line data-bond x1="' + (xs[0] + shellR(ELAB_ATOMS[els[0]].shells.length - 1) + 10) + '" y1="' + cy
      + '" x2="' + (xs[1] - shellR(ELAB_ATOMS[els[1]].shells.length - 1) - 10) + '" y2="' + cy
      + '" stroke="#B45309" stroke-width="2" stroke-dasharray="5 5"/>';
  }

  const vbH = c.layout === 3 ? 300 : 280;
  return '<svg viewBox="0 0 620 ' + vbH + '" role="img" aria-label="电子实验室">'
    + atoms + movers + charge
    + '<text x="310" y="' + (vbH - 12) + '" text-anchor="middle" font-size="11.5" fill="var(--ink-2)">'
    + (c.kind === 'ionic' ? '金属原子失去电子 → 变成阳离子；非金属原子得到电子 → 变成阴离子'
      : c.layout === 3 ? '中心原子与两侧原子各出电子，共用电子对 → 形成共价键'
      : '两个原子各出电子，共用电子对 → 形成共价键')
    + '</text></svg>';
}

function elabResult(c) {
  return '<div class="elab-out"><h5>' + c.formula + '　' + c.name + '</h5>'
    + '<div class="elab-grid">'
    + '<div class="elab-cell">键型<br><b>' + (c.kind === 'ionic' ? '离子键' : '共价键' + (c.polar ? '（极性）' : '（非极性）')) + '</b></div>'

function elabPanelHtml() {
  const a = PRACSTATE.elabA, b = PRACSTATE.elabB;

  let atoms = keys.map(function (k) {

function elabPlay() {
  const svg = document.querySelector('.elab-stage svg');
  if (!svg) return;
  const movers = Array.prototype.slice.call(svg.querySelectorAll('[data-mover]'));
  if (!movers.length) { svg.classList.add('played'); return; }
  svg.classList.remove('played');
  movers.forEach(function (m) {
    m.setAttribute('cx', m.dataset.x0);
    m.setAttribute('cy', m.dataset.y0);
  });
  const dur = 850;
  const t0 = performance.now();
  function step(now) {
    const p = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - p, 3);
    movers.forEach(function (m) {
      const x0 = +m.dataset.x0, y0 = +m.dataset.y0, x1 = +m.dataset.x1, y1 = +m.dataset.y1;
      m.setAttribute('cx', (x0 + (x1 - x0) * e).toFixed(1));
      m.setAttribute('cy', (y0 + (y1 - y0) * e).toFixed(1));
    });
    if (p < 1) requestAnimationFrame(step);
    else svg.classList.add('played');
  }
  requestAnimationFrame(step);
}

function predPanelHtml() {
  const i = PRACSTATE.predIndex;
  const q = PREDICT[i];
  const picked = PRACSTATE.predPicked;
  const opts = q.opts.map(function (o, k) {
    let cls = 'pred-opt';
    if (picked >= 0) {
      if (k === q.ok) cls += ' ok';
      else if (k === picked) cls += ' bad';
    }
    return '<button class="' + cls + '" data-pred="' + k + '"' + (picked >= 0 ? ' disabled' : '') + '>'
      + String.fromCharCode(65 + k) + '. ' + o.t + '</button>';
  }).join('');

  let fb = '';
  if (picked >= 0) {
    const good = picked === q.ok;
    const wrong = q.opts[picked].why || '';
    fb = '<div class="pred-fb"><b style="color:' + (good ? '#0B6B3E' : '#A5261B') + '">'
      + (good ? '答对了' : '这个选项不对') + '</b>'
      + '<br>' + (good ? q.why : wrong + '<br>' + q.why) + '</div>'
      + '<div class="ai-row"><button class="btn primary" data-pred-next>'
      + (i + 1 < PREDICT.length ? '下一题 →' : '看结果 →') + '</button></div>';
  }

  const answered = i + (picked >= 0 ? 1 : 0);
  const pct = Math.round((answered / PREDICT.length) * 100);
  return '<div class="g9-tool"><h4>第 ' + (i + 1) + ' / ' + PREDICT.length + ' 题</h4>'
    + '<div class="pred-q"><div class="pred-eq">' + q.left + ' <span style="color:var(--brand)">?</span></div>'
    + '<div class="pred-opts">' + opts + '</div>' + fb + '</div>'
    + '<div class="pred-bar"><span style="width:' + pct + '%"></span></div>'

function predDoneHtml() {

/* ---------- 错题本 ---------- */
const WRONG = { keys: [], i: 0, picked: -1, right: 0 };

function wrongCount() {
  return Object.keys(PROG.wrong).length;
}

function wrongList() {
  const out = [];
  Object.keys(PROG.wrong).forEach(function (key) {
    const e = PROG.wrong[key] || {};
    let i = typeof e.i === 'number' ? e.i : -1;
    if (!PREDICT[i] || PREDICT[i].left !== key) {
      i = PREDICT.findIndex(function (q) { return q.left === key; });
    }
    if (i < 0) return;
    out.push({ key: key, i: i, q: PREDICT[i], picked: typeof e.picked === 'number' ? e.picked : -1, times: e.times || 1, ts: e.ts || 0 });
  });
  out.sort(function (a, b) { return b.ts - a.ts; });
  return out;
}

function refreshWrongCount() {
  const n = wrongCount();
  const el = document.getElementById('wrong-count');
  if (el) {
    el.textContent = n;
    el.style.display = n ? 'inline-flex' : 'none';
  }
}

function markWrong(q, picked, idx) {
  const key = q.left;
  const cur = PROG.wrong[key];
  PROG.wrong[key] = {
    i: idx,
    picked: picked,
    times: (cur && cur.times ? cur.times : 0) + 1,
    ts: Date.now()
  };
  saveProg();
  refreshWrongCount();
}

function clearWrong(q) {
  if (!PROG.wrong[q.left]) return;
  delete PROG.wrong[q.left];
  saveProg();
  refreshWrongCount();
}

function wrongPageHtml() {
  if (WRONG.keys.length) return wrongRunHtml();
  const list = wrongList();
  if (!list.length) {
    return '<div class="g9-tool"><h4>还没有错题</h4>'
      + '<p class="tool-readout">去「产物预测」练一轮，答错的题会自动收到这里；再答对就会移出。</p>'
      + '<div class="ai-row"><button class="btn primary" data-wrong-go>去产物预测</button></div></div>';
  }
  const items = list.map(function (it) {
    const q = it.q;
    const pickedText = (it.picked >= 0 && q.opts[it.picked]) ? q.opts[it.picked].t : '—';
    const why = (it.picked >= 0 && q.opts[it.picked] && q.opts[it.picked].why) ? q.opts[it.picked].why : '';
    return '<div class="wrong-item">'
      + '<div class="wrong-eq">' + q.left + ' <span class="wrong-q">?</span></div>'
      + '<div class="wrong-line"><b>你选了</b>' + pickedText + '<span class="wrong-times">错 ' + it.times + ' 次</span></div>'
      + (why ? '<div class="wrong-line"><b>错因</b>' + why + '</div>' : '')
      + '<div class="wrong-line"><b>正确</b>' + q.opts[q.ok].t + '</div>'
      + '<div class="wrong-line"><b>解析</b>' + q.why + '</div>'
      + '<div class="ai-row"><button class="btn" data-wrong-one="' + it.i + '">重做这题</button></div>'
      + '</div>';
  }).join('');
  return '<div class="g9-tool"><h4>错题 ' + list.length + ' 道</h4>'
    + '<p class="tool-readout">答对会自动移出；「重做全部」不影响正常预测进度。</p>'
    + '<div class="ai-row"><button class="btn primary" data-wrong-start>重做全部错题</button>'
    + '<button class="btn" data-wrong-clear>清空错题本</button></div></div>'
    + '<div class="wrong-list">' + items + '</div>';
}

function wrongRunHtml() {
  const key = WRONG.keys[WRONG.i];
  if (!key) return wrongRunDoneHtml();
  const q = PREDICT.filter(function (x) { return x.left === key; })[0];
  if (!q) { WRONG.i++; return wrongRunHtml(); }
  const picked = WRONG.picked;
  const opts = q.opts.map(function (o, i) {
    let cls = 'pred-opt';
    if (picked >= 0) {
      if (i === q.ok) cls += ' ok';
      else if (i === picked) cls += ' bad';
    }
    return '<button class="' + cls + '" data-wrong-opt="' + i + '"' + (picked >= 0 ? ' disabled' : '') + '>'
      + String.fromCharCode(65 + i) + '. ' + o.t + '</button>';
  }).join('');

  let fb = '';
  if (picked >= 0) {
    const good = picked === q.ok;
    fb = '<div class="pred-fb"><b style="color:' + (good ? '#0B6B3E' : '#A5261B') + '">'
      + (good ? '答对了，这题已移出错题本' : '又错了，这题继续留在错题本') + '</b><br>'
      + (good ? q.why : ((q.opts[picked].why || '') + '<br>' + q.why)) + '</div>'
      + '<div class="ai-row"><button class="btn primary" data-wrong-next>'
      + (WRONG.i + 1 < WRONG.keys.length ? '下一题 →' : '看结果 →') + '</button></div>';
  }

  return '<div class="g9-tool"><h4>错题重做 · 第 ' + (WRONG.i + 1) + ' / ' + WRONG.keys.length + ' 题</h4>'
    + '<div class="pred-q"><div class="pred-eq">' + q.left + ' <span style="color:var(--brand)">?</span></div>'
    + '<div class="pred-opts">' + opts + '</div>' + fb + '</div></div>'
    + '<div class="ai-row"><button class="btn" data-wrong-back>← 返回错题本</button></div>';
}

function wrongRunDoneHtml() {
  const left = wrongCount();
  return '<div class="g9-tool"><h4>本轮重做完成</h4>'
    + '<div class="pred-q"><div class="pred-eq">答对 ' + WRONG.right + ' / ' + WRONG.keys.length + '</div>'
    + '<p class="tool-readout">' + (left ? '还有 ' + left + ' 道错题留在本里，可以再重做一轮。' : '错题本清空了，漂亮。') + '</p>'
    + '<div class="ai-row"><button class="btn primary" data-wrong-back>返回错题本</button></div></div></div>';
}

function renderWrongBody() {
  const body = document.getElementById('wrong-body');
  if (body) body.innerHTML = wrongPageHtml();
  refreshWrongCount();
}

function startWrongRun(idx) {
  const list = wrongList();
  if (idx >= 0) {
    const one = list.filter(function (x) { return x.i === idx; })[0];
    WRONG.keys = one ? [one.key] : [];
  } else {
    WRONG.keys = list.map(function (x) { return x.key; });
  }
  WRONG.i = 0;
  WRONG.picked = -1;
  WRONG.right = 0;
  renderWrongBody();
}

  const h = window.location.hash;
  if (h.indexOf('#/a/') === 0) {
    window.location.replace('#/r/' + h.slice(4));
    return;
  }
  if (h !== lastRouteHash) {
    lastRouteHash = h;
    window.scrollTo(0, 0);
  }
  const isBond = h === '#/bond' || h.indexOf('#/bond/') === 0;
  const isWhy = h === '#/why' || h.indexOf('#/why/') === 0;
  const isG9 = h === '#/g9' || h.indexOf('#/g9/') === 0;
  const isPrac = h === '#/prac' || h.indexOf('#/prac/') === 0;
  const isDetail = h.indexOf('#/r/') === 0;
  const isBal = h.indexOf('#/b/') === 0;
  animHalt();
  if (!isBond && !isWhy && !isG9 && !isPrac) labHalt();
  trackRoute(h);
  syncTopH();
  const activeTab = isBond ? 'bond' : isWhy ? 'why' : isG9 ? 'g9' : isPrac ? 'prac' : 'library';
  Array.prototype.forEach.call(document.querySelectorAll('.coursetab'), function (a) {
    a.classList.toggle('on', a.getAttribute('data-tab') === activeTab);
  });
  if (isDetail) {
    renderDetail(h.slice(4));
  } else if (isBal) {
    renderBalance(h.slice(4));
  } else if (isBond) {
    renderBondGuide(h.indexOf('#/bond/') === 0 ? h.slice(7) : '');
  } else if (isWhy) {
    renderWhyGuide(h.indexOf('#/why/') === 0 ? h.slice(6) : '');
  } else if (isG9) {
    renderG9Guide(h.indexOf('#/g9/') === 0 ? h.slice(5) : '');
  } else if (isPrac) {
    renderPracGuide(h.indexOf('#/prac/') === 0 ? h.slice(7) : '');
  } else {
    renderList();
  }
}

document.getElementById('view').addEventListener('click', function (e) {
  const view = document.getElementById('view');

  const card = e.target.closest('.card');
  if (card) {
    window.location.hash = '#/r/' + card.dataset.id;
    return;
  }

  const g9GradeBtn = e.target.closest('[data-g9grade]');
  if (g9GradeBtn) {
    const g = g9GradeBtn.dataset.g9grade === 'up' ? 'up' : 'down';
    PROG.g9grade = g;
    saveProg();
    window.location.hash = '#/g9/' + (g === 'up' ? 'u-overview' : 'g9-overview');
    return;
  }

  const navLesson = e.target.closest('[data-lesson]');
  if (navLesson) {
    const base = window.location.hash.indexOf('#/why') === 0 ? '#/why/'
      : window.location.hash.indexOf('#/g9') === 0 ? '#/g9/'
      : '#/bond/';
    window.location.hash = base + navLesson.dataset.lesson;
    return;
  }

  const metalCase = e.target.closest('[data-metal-case]');
  if (metalCase) {
    G9STATE.metalCase = Number(metalCase.dataset.metalCase);
    G9STATE.metalStep = 0;
    const box = document.getElementById('g9-tool');
    if (box) box.innerHTML = g9ToolHtml('metal');
    return;
  }

  if (e.target.closest('[data-metal-next]')) {
    const steps = METAL_CASES[G9STATE.metalCase].steps;
    if (G9STATE.metalStep < steps.length) G9STATE.metalStep++;
    const box = document.getElementById('g9-tool');
    if (box) box.innerHTML = g9ToolHtml('metal');
    return;
  }

  if (e.target.closest('[data-metal-reset]')) {
    G9STATE.metalStep = 0;
    const box = document.getElementById('g9-tool');
    if (box) box.innerHTML = g9ToolHtml('metal');
    return;
  }

  const pfReagent = e.target.closest('[data-purify]');
  if (pfReagent) {
    const pid = pfReagent.dataset.purify;
    if (G9STATE.purifySeq.indexOf(pid) === -1 && G9STATE.purifySeq.length < PURIFY_REAGENTS.length) {
      G9STATE.purifySeq.push(pid);
      G9STATE.purifyResult = null;
      const box = document.getElementById('purifyBox');
      if (box) box.outerHTML = purifyToolHtml();
    }
    return;
  }

  if (e.target.closest('[data-purify-check]')) {
    purifyCheck();
    const box = document.getElementById('purifyBox');
    if (box) box.outerHTML = purifyToolHtml();
    return;
  }

  if (e.target.closest('[data-purify-reset]')) {
    G9STATE.purifySeq = [];
    G9STATE.purifyResult = null;
    const box = document.getElementById('purifyBox');
    if (box) box.outerHTML = purifyToolHtml();
    return;
  }

  if (e.target.closest('[data-purify-answer]')) {
    G9STATE.purifyAnswer = !G9STATE.purifyAnswer;
    const box = document.getElementById('purifyBox');
    if (box) box.outerHTML = purifyToolHtml();
    return;
  }

  const inferClue = e.target.closest('[data-infer-clue]');
  if (inferClue) {
    const cid = inferClue.dataset.inferClue;
    const at = G9STATE.inferPicked.indexOf(cid);
    if (at >= 0) G9STATE.inferPicked.splice(at, 1);
    else G9STATE.inferPicked.push(cid);
    const box = document.getElementById('inferBox');
    if (box) box.outerHTML = inferToolHtml();
    return;
  }

  if (e.target.closest('[data-infer-reset]')) {
    G9STATE.inferPicked = [];
    const box = document.getElementById('inferBox');
    if (box) box.outerHTML = inferToolHtml();
    return;
  }

  const inqReagent = e.target.closest('[data-inquiry-reagent]');
  if (inqReagent) {
    inquiryPick(inqReagent.dataset.inquiryReagent);
    const box = document.getElementById('inquiryBox');
    if (box) box.outerHTML = inquiryToolHtml();
    return;
  }

  const inqNext = e.target.closest('[data-inquiry-next]');
  if (inqNext) {
    inquiryNext(inqNext.dataset.inquiryNext);
    const box = document.getElementById('inquiryBox');
    if (box) box.outerHTML = inquiryToolHtml();
    return;
  }

  if (e.target.closest('[data-inquiry-scenario]')) {
    inquiryScenario();
    const box = document.getElementById('inquiryBox');
    if (box) box.outerHTML = inquiryToolHtml();
    return;
  }

  if (e.target.closest('[data-inquiry-reset]')) {
    const sc = G9STATE.inq.scenario;
    inqReset(sc);
    const box = document.getElementById('inquiryBox');
    if (box) box.outerHTML = inquiryToolHtml();
    return;
  }

  const pracNavBtn = e.target.closest('[data-prac]');
  if (pracNavBtn) {
    window.location.hash = '#/prac/' + pracNavBtn.dataset.prac;
    return;
  }

  const aiTab = e.target.closest('[data-ai-level]');
  if (aiTab) {
    switchAiLevel(Number(aiTab.dataset.aiLevel));
    return;
  }

  const elabAtom = e.target.closest('[data-elab]');
  if (elabAtom) {
    const el = elabAtom.dataset.elab;
    if (!PRACSTATE.elabA) PRACSTATE.elabA = el;
    else if (!PRACSTATE.elabB) PRACSTATE.elabB = el;
    else { PRACSTATE.elabA = el; PRACSTATE.elabB = null; }
    const box = document.querySelector('.lesson-main .g9-tool');
    if (box) box.outerHTML = elabPanelHtml();
    return;
  }

  if (e.target.closest('[data-elab-play]')) {
    elabPlay();
    return;
  }

  if (e.target.closest('[data-elab-reset]')) {
    PRACSTATE.elabA = null;
    PRACSTATE.elabB = null;
    const box = document.querySelector('.lesson-main .g9-tool');
    if (box) box.outerHTML = elabPanelHtml();
    return;
  }

  const wrongStart = e.target.closest('[data-wrong-start]');
  if (wrongStart) {
    startWrongRun(-1);
    return;
  }

  const wrongOne = e.target.closest('[data-wrong-one]');
  if (wrongOne) {
    startWrongRun(Number(wrongOne.dataset.wrongOne));
    return;
  }

  const wrongOpt = e.target.closest('[data-wrong-opt]');
  if (wrongOpt) {
    if (WRONG.picked >= 0) return;
    const q = PREDICT.filter(function (x) { return x.left === WRONG.keys[WRONG.i]; })[0];
    if (!q) return;
    const k = Number(wrongOpt.dataset.wrongOpt);
    WRONG.picked = k;
    if (k === q.ok) {
      WRONG.right++;
      clearWrong(q);
    } else {
      markWrong(q, k, PREDICT.indexOf(q));
    }
    renderWrongBody();
    return;
  }

  if (e.target.closest('[data-wrong-next]')) {
    WRONG.i++;
    WRONG.picked = -1;
    renderWrongBody();
    return;
  }

  if (e.target.closest('[data-wrong-back]')) {
    WRONG.keys = [];
    WRONG.i = 0;
    WRONG.picked = -1;
    WRONG.right = 0;
    renderWrongBody();
    return;
  }

  if (e.target.closest('[data-wrong-clear]')) {
    if (window.confirm('清空错题本？清空后不能恢复。')) {
      PROG.wrong = {};
      saveProg();
      WRONG.keys = [];
      renderWrongBody();
    }
    return;
  }

  if (e.target.closest('[data-wrong-go]')) {
    window.location.hash = '#/prac/predict';
    return;
  }

  const predOpt = e.target.closest('[data-pred]');
  if (predOpt) {
    if (PRACSTATE.predPicked >= 0) return;
    const k = Number(predOpt.dataset.pred);
    const q = PREDICT[PRACSTATE.predIndex];
    PRACSTATE.predPicked = k;
    if (k === q.ok) PRACSTATE.predRight++;
    PROG.predict.answered++;
    if (k === q.ok) PROG.predict.correct++;
    if (k === q.ok) clearWrong(q); else markWrong(q, k, PRACSTATE.predIndex);
    saveProg();
    const body = document.getElementById('pred-body');
    if (body) body.innerHTML = predPanelHtml();
    return;
  }

  if (e.target.closest('[data-pred-next]')) {
    PRACSTATE.predIndex++;
    PRACSTATE.predPicked = -1;
    const body = document.getElementById('pred-body');
    if (body) body.innerHTML = PRACSTATE.predIndex >= PREDICT.length ? predDoneHtml() : predPanelHtml();
    return;
  }

  if (e.target.closest('[data-pred-restart]')) {
    PRACSTATE.predIndex = 0;
    PRACSTATE.predRight = 0;
    PRACSTATE.predPicked = -1;
    const body = document.getElementById('pred-body');
    if (body) body.innerHTML = predPanelHtml();
    return;
  }

  const aiCopy = e.target.closest('[data-ai-copy]');
  if (aiCopy) {
    const lv = AI_LEVELS.filter(function (x) { return String(x.id) === aiCopy.dataset.aiCopy; })[0];
    if (lv) {
      const btn = aiCopy;
      const done = function () {
        btn.textContent = '已复制';
        setTimeout(function () { btn.textContent = '复制提示词'; }, 1300);
      };
      const fallback = function () {
        const ta = document.createElement('textarea');
        ta.value = lv.tpl;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch (err) {}
        document.body.removeChild(ta);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(lv.tpl).then(done).catch(function () { fallback(); done(); });
      } else { fallback(); done(); }
    }
    return;
  }

  if (e.target.closest('[data-prac-reset]')) {
    if (window.confirm('清空所有成就进度？这个操作不能撤销。')) {
      PROG = emptyProg();
      saveProg();
      renderPracGuide('badges');
    }
    return;
  }

  if (e.target.closest('[data-lab-play]')) {
    if (LAB.playing) { labPause(); }
    else if (LAB.t >= LAB.dur && !LAB.loop) { labReplay(); }
    else { labStart(); }
    return;
  }

  if (e.target.closest('[data-lab-replay]')) {
    labReplay();
    return;
  }

  const labMode = e.target.closest('[data-lab-mode]');
  if (labMode) {
    LAB.mode = labMode.dataset.labMode;
    buildLab(lessonById(LAB.lesson));
    return;
  }

  const seekBtn = e.target.closest('[data-seek]');
  if (seekBtn) {
    animSeek(Number(seekBtn.dataset.seek));
    return;
  }

  if (e.target.closest('[data-full-anim]')) {
    if (ANIM.playing) {
      animPause();
    } else if (ANIM.t >= ANIM.dur || ANIM.t <= 0) {
      ANIM.t = 0;
      ANIM.phase = -1;
      ANIM.flashKey = '';
      animPaint(0);
      animPlay();
    } else {
      animPlay();
    }
    return;
  }

  if (e.target.closest('[data-play]')) {
    if (ANIM.playing) { animPause(); } else { animPlay(); }
    return;
  }

  if (e.target.closest('[data-reset-anim]')) {
    if (document.querySelector('[data-full-anim]')) {
      if (ANIM.mode === 'bad') {
        ANIM.mode = 'ok';
        const r = REACTIONS.find(function (x) { return x.id === ANIM.id; });
        if (r) buildAnimStage(r);
      }
      showAnimPreview();
      updateModeBtn();
    }
    return;
  }

  if (e.target.closest('[data-mode]')) {
    ANIM.mode = ANIM.mode === 'ok' ? 'bad' : 'ok';
    if (document.querySelector('[data-full-anim]')) {
      const r = REACTIONS.find(function (x) { return x.id === ANIM.id; });
      if (r) {
        buildAnimStage(r);
        ANIM.t = 0;
        ANIM.phase = -1;
        ANIM.flashKey = '';
        animPaint(0);
        animPlay();
        updateModeBtn();
      }
    }
    return;
  }

  const exportBtn = e.target.closest('[data-export]');
  if (exportBtn) {
    const r = REACTIONS.find(function (x) { return x.id === exportBtn.dataset.export; });
    if (r) {
      exportBtn.disabled = true;
      exportBtn.textContent = '生成中…';
      setTimeout(function () {
        exportReactionCard(r);
        exportBtn.textContent = '已保存';
        setTimeout(function () {
          exportBtn.textContent = '保存图片';
          exportBtn.disabled = false;
        }, 1200);
      }, 30);
    }
    return;
  }

  const balBtn = e.target.closest('[data-bal]');
  if (balBtn) {
    window.location.hash = '#/b/' + balBtn.dataset.bal;
    return;
  }

  const cbtn = e.target.closest('.cbtn');
  if (cbtn) {
    const side = cbtn.dataset.side;
    const i = Number(cbtn.dataset.i);
    const dir = Number(cbtn.dataset.dir);
    const arr = side === 'L' ? BAL.L : BAL.R;
    arr[i] = Math.min(COEF_MAX, Math.max(COEF_MIN, arr[i] + dir));
    renderBalance(BAL.id, true);
    const again = view.querySelector('.cbtn[data-side="' + side + '"][data-i="' + i + '"][data-dir="' + dir + '"]');
    if (again && !again.disabled) again.focus();
    return;
  }

  if (e.target.closest('[data-reset]') || e.target.closest('[data-answer]')) {
    const r = REACTIONS.find(function (x) { return x.id === BAL.id; });
    const answer = !!e.target.closest('[data-answer]');
    if (r) {
      BAL.L = r.left.map(function (it) { return answer ? it.coef : 1; });
      BAL.R = r.right.map(function (it) { return answer ? it.coef : 1; });
      renderBalance(BAL.id, true);
    }
    return;
  }

  const detailBtn = e.target.closest('[data-detail]');
  if (detailBtn) {
    window.location.hash = '#/r/' + detailBtn.dataset.detail;
    return;
  }

  if (e.target.closest('[data-back]')) {
    window.location.hash = '#/';
    return;
  }

  const f = e.target.closest('[data-filter]');
  if (f) {
    state.filter = f.dataset.filter;
    renderList();
  }
});

document.getElementById('view').addEventListener('keydown', function (e) {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const card = e.target.closest('.card');
  if (!card || e.target !== card) return;
  e.preventDefault();
  window.location.hash = '#/r/' + card.dataset.id;
});

function currentTheme() {
  return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
}

/* 吸顶操作行要贴在固定顶栏下方，顶栏高度交给 CSS 变量 */
function syncTopH() {
  const top = document.querySelector('.top');
  if (top) document.documentElement.style.setProperty('--topH', top.offsetHeight + 'px');
}
syncTopH();
window.addEventListener('resize', syncTopH);
window.addEventListener('load', syncTopH);

function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
  const btn = document.getElementById('themeToggle');
  if (btn) btn.textContent = t === 'dark' ? '切换浅色' : '切换深色';
  try { localStorage.setItem('chemLab.theme', t); } catch (e) {}
}

applyTheme(currentTheme());
document.getElementById('themeToggle').addEventListener('click', function () {
  applyTheme(currentTheme() === 'dark' ? 'light' : 'dark');
});

/* 全屏 */
const fsBtn = document.getElementById('fsToggle');
function fsElement() {
  return document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement || null;
}
function syncFsBtn() {
  if (!fsBtn) return;
  const on = !!fsElement();
  fsBtn.textContent = on ? '退出全屏' : '全屏';
  fsBtn.title = on ? '退出全屏' : '全屏';
  fsBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
}
function showFsHint() {
  let t = document.getElementById('fsHint');
  if (!t) {
    t = document.createElement('div');
    t.id = 'fsHint';
    t.className = 'fs-hint';
    t.setAttribute('role', 'status');
    document.body.appendChild(t);
  }
  t.textContent = '这个浏览器不支持网页全屏。iPhone 可点「分享 → 添加到主屏幕」，或横屏使用。';
  t.classList.add('show');
  clearTimeout(showFsHint.timer);
  showFsHint.timer = setTimeout(function () { t.classList.remove('show'); }, 4200);
}
function toggleFullscreen() {
  const exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
  if (fsElement()) {
    if (exit) {
      const p = exit.call(document);
      if (p && p.catch) p.catch(showFsHint);
    }
    return;
  }
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  if (!req) { showFsHint(); return; }
  try {
    const p = req.call(el);
    if (p && p.catch) p.catch(showFsHint);
  } catch (e) { showFsHint(); }
}
if (fsBtn) fsBtn.addEventListener('click', toggleFullscreen);
document.addEventListener('fullscreenchange', syncFsBtn);
document.addEventListener('webkitfullscreenchange', syncFsBtn);
syncFsBtn();

function applyValenceVisibility() {
  const v = document.getElementById('view');
  if (v) v.classList.toggle('hide-val', !state.showVal);
}
applyValenceVisibility();

document.getElementById('view').addEventListener('change', function (e) {
  if (!e.target.matches('[data-val-toggle]')) return;
  state.showVal = e.target.checked;
  applyValenceVisibility();
});

document.getElementById('view').addEventListener('input', function (e) {
  if (e.target.matches('[data-ratio]')) updateRatio();
  else if (e.target.matches('[data-sol-t]')) updateSol();
  else if (e.target.matches('[data-ph-v]')) updatePH();
  else if (e.target.matches('[data-calc-zn],[data-calc-acid]')) updateCalc();
  else if (e.target.matches('[data-ai-text]')) {
    PROG.ai['text' + e.target.dataset.aiText] = e.target.value;
    saveProg();
  }
});

document.getElementById('view').addEventListener('change', function (e) {
  if (e.target.matches('[data-ion-a],[data-ion-b]')) updateIon();
  else if (e.target.matches('[data-ai-check]')) {
    PROG.ai[e.target.dataset.aiCheck] = e.target.checked;
    saveProg();
    refreshAiMeta();
  }
});

window.addEventListener('hashchange', route);
route();
